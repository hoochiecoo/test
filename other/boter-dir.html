
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEO Planner (Productivity Patterns)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e6ebee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overscroll-behavior: none;
        }
        .phone-mockup {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        /* Для десктопа имитируем рамки телефона */
        @media (min-width: 600px) {
            .phone-mockup {
                height: 90vh;
                border-radius: 30px;
                border: 8px solid #333;
            }
        }
        .header {
            background-color: #fff;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            color: #000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .api-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .tools-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 5px 0;
            flex-wrap: wrap;
        }
        .tool-btn {
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            color: #1565c0;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .tool-btn:active {
            background-color: #bbdefb;
        }
        .chat-container {
            flex-grow: 1;
            background-color: #93a8b3;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .bot {
            background-color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: #333;
        }
        .user {
            background-color: #e3f2fd;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            color: #0d47a1;
        }
        .input-area {
            background-color: #fff;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #ddd;
            padding-bottom: env(safe-area-inset-bottom); /* Для iPhone */
        }
        .input-box {
            flex-grow: 1;
            background-color: #f1f1f1;
            border: none;
            border-radius: 20px;
            padding: 12px 15px;
            outline: none;
            font-size: 16px; /* Предотвращает зум на iOS */
        }
        .send-btn {
            background-color: #1c93e3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .send-btn:active {
            transform: scale(0.9);
        }
        .send-btn:disabled {
            background-color: #ccc;
        }
        .message ul, .message ol {
            margin: 5px 0 5px 20px;
            padding: 0;
        }
        .clear-btn {
            font-size: 10px;
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            border: none;
            background: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="phone-mockup">
    <div class="header">
        <div>CEO Productivity Bot 🧠</div>
        <input type="password" id="apiKey" class="api-input" placeholder="Gemini API Key (сохраняется локально)" onchange="saveKey()">
        <div class="tools-bar">
            <button class="tool-btn" onclick="sendHiddenCommand('Сделай сверку часов: напомни мне мои главные задачи и спроси, на чем мой фокус.')">⏰ Сверка</button>
            <button class="tool-btn" onclick="sendHiddenCommand('Подведи итоги дня. Что сделано, какие заметки/обещания в Inbox, и что переносим на завтра?')">🌙 Итоги</button>
            <button class="clear-btn" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>
    
    <div class="chat-container" id="chat">
        <!-- Сообщения будут тут -->
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" class="input-box" placeholder="Задачи, мысли..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const SYSTEM_INSTRUCTION = "Ты — ИИ-ассистент генерального директора. Твоя главная цель — снижение его когнитивной нагрузки. Ты работаешь на основе 3 паттернов продуктивности: " +
    "1. ПАТТЕРН БЫСТРЫЙ ЗАХВАТ (INBOX): Если директор пишет случайную мысль, идею или обещание кому-то (например: 'Обещал скинуть Оле презу', 'Надо купить кресла'), не задавай лишних вопросов. Коротко ответь: '📥 Сохранено в Inbox' или '📥 Обещание зафиксировано'. " +
    "2. ПАТТЕРН ИНТЕРВАЛЬНЫЕ ПИНГИ: Если директор пишет задачи на день — утверди их четким списком. Если приходит команда 'Сверка часов' — возвращай его к списку задач и спрашивай: 'Ты сейчас делаешь то, что планировал, или спасаешь мир?'. " +
    "3. ПАТТЕРН ЧИСТЫЙ ЛИСТ (ИТОГИ ДНЯ): По запросу итогов дня сформируй дайджест: что выполнено, что в Inbox, и предложи перенести остальное на завтра. " +
    "Стиль общения: лаконичный, деловой, уверенный, без воды. Используй эмодзи (📌, ✅, 📥).";

    let chatHistory = [];

    // Загрузка данных при старте
    window.onload = () => {
        const savedKey = localStorage.getItem('ceo_planner_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        const savedHistory = localStorage.getItem('ceo_planner_history');
        if (savedHistory) {
            chatHistory = JSON.parse(savedHistory);
            renderHistory();
        } else {
            // Приветственное сообщение, если истории нет
            appendMessage("Привет! Я твой ИИ-партнер. Моя задача — разгрузить твою голову.<br><br>• Кидай сюда <b>любые мысли</b> — я сохраню их в Inbox.<br>• Напиши <b>план на день</b> — я буду держать тебя в фокусе.", 'bot');
        }
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        localStorage.setItem('ceo_planner_key', key);
    }

    function saveHistory() {
        localStorage.setItem('ceo_planner_history', JSON.stringify(chatHistory));
    }

    function clearHistory() {
        if (confirm("Очистить историю переписки?")) {
            chatHistory = [];
            localStorage.removeItem('ceo_planner_history');
            document.getElementById('chat').innerHTML = '';
            appendMessage("История очищена. Жду новых задач.", 'bot');
        }
    }

    function renderHistory() {
        const chat = document.getElementById('chat');
        chat.innerHTML = '';
        chatHistory.forEach(msg => {
            const role = msg.role === 'user' ? 'user' : 'bot';
            appendMessage(msg.parts[0].text, role, null, false);
        });
    }

    async function sendMessage() {
        const inputField = document.getElementById('messageInput');
        const messageText = inputField.value.trim();
        
        if (!messageText) return;
        
        appendMessage(messageText, 'user');
        inputField.value = '';
        
        await processAIRequest(messageText);
    }

    async function sendHiddenCommand(hiddenText) {
        appendMessage("<i>" + hiddenText.substring(0, 30) + "...</i>", 'user');
        await processAIRequest(hiddenText);
    }

    async function processAIRequest(text) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const sendBtn = document.getElementById('sendBtn');

        if (!apiKey) {
            alert('Пожалуйста, вставьте ваш Gemini API ключ.');
            return;
        }

        sendBtn.disabled = true;

        chatHistory.push({
            role: "user",
            parts: [{ text: text }]
        });
        saveHistory();

        const typingId = "typing-" + Date.now();
        appendMessage("...", "bot", typingId);

        try {
            // Оставляю модель 3.5 по запросу (хотя актуальная 1.5, будет работать если Google обновит алиас)
            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=" + apiKey;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: SYSTEM_INSTRUCTION }]
                    },
                    contents: chatHistory
                })
            });

            const data = await response.json();
            const typingElem = document.getElementById(typingId);
            if (typingElem) typingElem.remove();

            if (data.error) {
                appendMessage("❌ Ошибка API: " + data.error.message, 'bot');
                chatHistory.pop(); 
            } else {
                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage(botReply, 'bot');
                
                chatHistory.push({
                    role: "model",
                    parts: [{ text: botReply }]
                });
                saveHistory();
            }
        } catch (error) {
            const typingElem = document.getElementById(typingId);
            if (typingElem) typingElem.remove();
            appendMessage("❌ Ошибка сети. Проверьте ключ или соединение.", 'bot');
            chatHistory.pop();
        }

        sendBtn.disabled = false;
        if (window.innerWidth > 600) document.getElementById('messageInput').focus();
    }

    function appendMessage(text, sender, id = null, shouldScroll = true) {
        const chat = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = "message " + sender;
        if (id) msgDiv.id = id;
        
        let formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g, '<i>$1</i>')    
            .replace(/\n/g, '<br>');               
            
        msgDiv.innerHTML = formattedText;
        chat.appendChild(msgDiv);
        
        if (shouldScroll) {
            chat.scrollTop = chat.scrollHeight;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
