<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speech Recognition Translator</title>

  <style>
    /* =========================
       CSS ОСТАВЛЕН БЕЗ ИЗМЕНЕНИЙ (ВЕСЬ ВАШ ДИЗАЙН СОХРАНЕН)
    ========================= */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #fff; }
    body { overflow: hidden; }
    button, select { font: inherit; }
    .container { display: flex; width: 100%; height: 100dvh; }
    .column { flex: 1; height: 100dvh; padding: 12px; overflow-y: auto; border-right: 1px solid #ddd; -webkit-overflow-scrolling: touch; }
    #liveTranslation { display: flex; flex-direction: column; overflow: hidden; }
    .live-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .live-title { margin: 0; font-size: 20px; white-space: nowrap; }
    .header-controls { display: flex; align-items: center; gap: 5px; min-width: 0; }
    #languageButton { flex: 0 1 auto; display: inline-flex; align-items: center; justify-content: center; min-width: 68px; max-width: 120px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 999px; background: #f5f5f5; color: #333; font-size: 12px; font-weight: 700; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; -webkit-tap-highlight-color: transparent; }
    #languageButton:active { transform: scale(0.98); }
    #recordButton { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 94px; padding: 8px 11px; border: 1px solid #ddd; border-radius: 999px; background: #f5f5f5; color: #555; font-size: 12px; font-weight: 700; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    #recordButton:active { transform: scale(0.98); }
    .record-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: #999; }
    #recordButton.recording { background: #fff4f4; border-color: #efb4b4; color: #b40000; }
    #recordButton.recording .record-dot { background: #e00000; animation: pulse 1.1s infinite; }
    #recordButton.starting { background: #fffbe9; border-color: #e5d687; color: #7b6800; }
    #recordButton.starting .record-dot { background: #d7b600; animation: pulse 0.8s infinite; }
    #recordButton.stopped { background: #f5f5f5; border-color: #ddd; color: #666; }
    #recordButton.ready { background: #eef9ee; border-color: #b9ddb9; color: #176117; }
    #recordButton.ready .record-dot { background: #35a535; }
    #recordButton.error { background: #fff1f1; border-color: #e5a4a4; color: #a00000; }
    #recordButton.error .record-dot { background: #cc0000; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    #liveTop { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #new > div { padding: 7px 0; border-bottom: 1px solid #eee; line-height: 1.5; }
    #new span { cursor: pointer; }
    #stableArea { flex: 0 0 auto; width: 100%; padding: 5px 0 4px; border-top: 2px solid #ddd; background: #fafafa; }
    .stable-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 3px 7px; color: #777; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    #cursorInfo { color: #333; }
    #stableWords { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; }
    .stable-word { position: relative; min-width: 0; min-height: 52px; padding: 6px 5px; overflow: hidden; background: #fff; border: 1px solid #e3e3e3; border-radius: 7px; cursor: pointer; }
    .stable-word.cursor { border: 2px solid #222; padding: 5px 4px; }
    .slot-number { position: absolute; top: 2px; right: 4px; color: #bbb; font-size: 9px; }
    .stable-original { display: block; width: calc(100% - 12px); overflow: hidden; font-size: 15px; font-weight: 700; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
    .stable-translation { display: block; width: 100%; margin-top: 4px; overflow: hidden; color: #666; font-size: 12px; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
    #savedLines { margin-top: 15px; line-height: 2; }
    #savedLines span { display: inline-block; margin-right: 8px; margin-bottom: 8px; padding: 7px 10px; background: #f2f2f2; border-radius: 8px; }
    #sortButton { padding: 10px 14px; border: 0; border-radius: 8px; background: #eee; cursor: pointer; }
    #finalText { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    .final-entry { padding: 10px 0; border-bottom: 1px solid #eee; }
    .final-entry.interim { padding: 10px; background: #fafafa; border: 1px dashed #ddd; border-radius: 10px; }
    .final-label { margin-bottom: 4px; color: #999; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .final-entry.interim .final-label { color: #8c7a00; }
    .final-original { font-size: 17px; font-weight: 600; line-height: 1.45; }
    .final-entry.interim .final-original { color: #555; }
    .final-translation { margin-top: 5px; color: #666; font-size: 15px; line-height: 1.45; }
    .final-translation.lagging { opacity: 0.82; }
    .translation-status { display: inline-block; margin-left: 7px; color: #aaa; font-size: 10px; font-weight: 400; vertical-align: middle; }
    #error { display: none; padding: 8px; color: red; font-size: 12px; font-weight: bold; text-align: center; }
    #languageModal { position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    #languageModal.open { display: flex; }
    .modal-card { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px; background: #fff; border-radius: 16px; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.24); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-header h3 { margin: 0; font-size: 20px; }
    #closeLanguageModal { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: #f2f2f2; font-size: 20px; cursor: pointer; }
    .language-field { margin-bottom: 10px; }
    .language-field label { display: block; margin-bottom: 7px; color: #555; font-size: 13px; font-weight: 700; }
    .language-field select { width: 100%; padding: 12px; background: #fff; border: 1px solid #d8d8d8; border-radius: 10px; font-size: 16px; }
    .language-swap-wrap { display: flex; align-items: center; justify-content: center; padding: 3px 0 10px; }
    #swapLanguages { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 40px; padding: 0; border: 1px solid #ddd; border-radius: 999px; background: #f4f4f4; color: #222; font-size: 24px; font-weight: 700; cursor: pointer; }
    #applyLanguages { width: 100%; padding: 13px 16px; border: 0; border-radius: 11px; background: #111; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    #deleteHistoryButton { width: 100%; margin-top: 10px; padding: 12px 16px; border: 1px solid #e5b1b1; border-radius: 11px; background: #fff5f5; color: #b00000; font-size: 14px; font-weight: 700; cursor: pointer; }
    .language-note { margin-top: 12px; color: #888; font-size: 12px; line-height: 1.4; }
    .mobile-menu { display: none; }
    @media (max-width: 768px) {
      body { overflow: hidden; }
      .container { display: block; height: calc(100dvh - 68px - env(safe-area-inset-bottom)); }
      .column { display: none; width: 100%; height: calc(100dvh - 68px - env(safe-area-inset-bottom)); padding: 10px; border: 0; }
      .column.active { display: block; }
      #liveTranslation.active { display: flex; }
      .live-header { padding: 6px 0; }
      .live-title { font-size: 16px; }
      .header-controls { gap: 4px; }
      #languageButton { min-width: 57px; max-width: 82px; padding: 7px 7px; font-size: 10px; }
      #recordButton { min-width: 78px; padding: 7px 7px; font-size: 10px; }
      #new > div { padding: 7px 0; font-size: 17px; line-height: 1.5; }
      #stableWords { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stable-word { min-height: 48px; padding: 5px; }
      .stable-word.cursor { padding: 4px 3px; }
      .stable-original { font-size: 14px; }
      .stable-translation { margin-top: 3px; font-size: 11px; }
      #savedTranslations h2, #finalResult h2 { position: sticky; top: 0; z-index: 10; margin: 0; padding: 10px 0; background: #fff; border-bottom: 1px solid #eee; }
      .mobile-menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: flex; height: calc(68px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255, 255, 255, 0.96); border-top: 1px solid #ddd; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .mobile-menu button { flex: 1; border: 0; background: transparent; color: #777; font-size: 14px; font-weight: 600; cursor: pointer; }
      .mobile-menu button.active { background: #f3f3f3; color: #000; }
      #languageModal { align-items: flex-end; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
      .modal-card { width: 100%; max-height: 85dvh; border-radius: 18px; }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- LIVE -->
    <div class="column active" id="liveTranslation">
      <div class="live-header">
        <h2 class="live-title">Live Translation</h2>
        <div class="header-controls">
          <button id="languageButton" type="button">SR → RU</button>
          <button id="recordButton" class="ready" type="button">
            <span class="record-dot"></span>
            <span id="recordStatus">Start</span>
          </button>
        </div>
      </div>
      <div id="error"></div>
      <div id="liveTop"><div id="new"></div></div>
      <div id="stableArea">
        <div class="stable-header">
          <span>Last 12 words</span>
          <span id="cursorInfo">next: 1</span>
        </div>
        <div id="stableWords"></div>
      </div>
    </div>

    <!-- SAVED -->
    <div class="column" id="savedTranslations">
      <h2>Saved Translations</h2>
      <button id="sortButton">Sort Alphabetically</button>
      <div id="savedLines"></div>
    </div>

    <!-- FINAL -->
    <div class="column" id="finalResult">
      <h2>Final Result</h2>
      <div id="finalText"></div>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <nav class="mobile-menu">
    <button class="menu-button active" data-target="liveTranslation">Live</button>
    <button class="menu-button" data-target="savedTranslations">Saved</button>
    <button class="menu-button" data-target="finalResult">Final</button>
  </nav>

  <!-- LANG MODAL -->
  <div id="languageModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Languages</h3>
        <button id="closeLanguageModal" type="button">×</button>
      </div>
      <div class="language-field">
        <label for="speechLanguageSelect">Speech recognition</label>
        <select id="speechLanguageSelect"></select>
      </div>
      <div class="language-swap-wrap">
        <button id="swapLanguages" type="button" title="Swap languages">⇄</button>
      </div>
      <div class="language-field">
        <label for="translationLanguageSelect">Translate to</label>
        <select id="translationLanguageSelect"></select>
      </div>
      <button id="applyLanguages" type="button">Apply</button>
      <button id="deleteHistoryButton" type="button">Delete history</button>
      <div class="language-note">
        On mobile, press Start once to allow microphone access. After that automatic recognition restart is enabled.
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       SETTINGS & CONSTANTS
    ========================================================= */
    const LIVE_WORD_LIMIT = 2;
    const LIVE_LINE_LIMIT = 30;
    const SLOT_COUNT = 12;
    const DUPLICATE_WINDOW = 6;
    const FINAL_HISTORY_LIMIT = 1000;
    const FIRST_INTERIM_TRANSLATE_DELAY = 40;
    const INTERIM_TRANSLATE_DELAY = 300;
    const STORAGE_KEY = 'speechTranslationFullStateV9';

    const SPEECH_LANGUAGES = [
      ['Afrikaans', 'af-ZA'], ['Arabic — Saudi Arabia', 'ar-SA'], ['Bulgarian', 'bg-BG'], ['Bengali', 'bn-IN'],
      ['Catalan', 'ca-ES'], ['Czech', 'cs-CZ'], ['Danish', 'da-DK'], ['German', 'de-DE'], ['Greek', 'el-GR'],
      ['English — UK', 'en-GB'], ['English — US', 'en-US'], ['Spanish — Spain', 'es-ES'], ['Basque', 'eu-ES'],
      ['Persian', 'fa-IR'], ['Finnish', 'fi-FI'], ['French — France', 'fr-FR'], ['Galician', 'gl-ES'],
      ['Gujarati', 'gu-IN'], ['Hebrew', 'he-IL'], ['Hindi', 'hi-IN'], ['Croatian', 'hr-HR'], ['Hungarian', 'hu-HU'],
      ['Indonesian', 'id-ID'], ['Icelandic', 'is-IS'], ['Italian', 'it-IT'], ['Japanese', 'ja-JP'],
      ['Kannada', 'kn-IN'], ['Korean', 'ko-KR'], ['Lithuanian', 'lt-LT'], ['Latvian', 'lv-LV'],
      ['Malayalam', 'ml-IN'], ['Marathi', 'mr-IN'], ['Malay', 'ms-MY'], ['Dutch', 'nl-NL'], ['Norwegian', 'nb-NO'],
      ['Polish', 'pl-PL'], ['Portuguese — Brazil', 'pt-BR'], ['Romanian', 'ro-RO'], ['Russian', 'ru-RU'],
      ['Slovak', 'sk-SK'], ['Slovenian', 'sl-SI'], ['Serbian', 'sr-RS'], ['Swedish', 'sv-SE'],
      ['Tamil', 'ta-IN'], ['Telugu', 'te-IN'], ['Thai', 'th-TH'], ['Turkish', 'tr-TR'],
      ['Ukrainian', 'uk-UA'], ['Urdu', 'ur-PK'], ['Vietnamese', 'vi-VN'], ['Chinese', 'cmn-Hans-CN']
    ];

    const TRANSLATION_LANGUAGES = [
      ['English', 'en'], ['Russian', 'ru'], ['Spanish', 'es'], ['French', 'fr'], ['German', 'de'],
      ['Chinese', 'zh-CN'], ['Japanese', 'ja'], ['Korean', 'ko'], ['Italian', 'it'], ['Serbian', 'sr'],
      ['Turkish', 'tr'], ['Ukrainian', 'uk'], ['Polish', 'pl']
    ];

    let speechLanguage = 'sr-RS';
    let translationLanguage = 'ru';

    /* =========================================================
       DOM ELEMENTS
    ========================================================= */
    const newLineElement = document.getElementById('new');
    const savedLinesElement = document.getElementById('savedLines');
    const finalTextElement = document.getElementById('finalText');
    const stableWordsElement = document.getElementById('stableWords');
    const cursorInfo = document.getElementById('cursorInfo');
    const sortButton = document.getElementById('sortButton');
    const errorElement = document.getElementById('error');
    const recordButton = document.getElementById('recordButton');
    const recordStatus = document.getElementById('recordStatus');
    const languageButton = document.getElementById('languageButton');
    const languageModal = document.getElementById('languageModal');
    const closeLanguageModal = document.getElementById('closeLanguageModal');
    const speechLanguageSelect = document.getElementById('speechLanguageSelect');
    const translationLanguageSelect = document.getElementById('translationLanguageSelect');
    const swapLanguagesButton = document.getElementById('swapLanguages');
    const applyLanguages = document.getElementById('applyLanguages');
    const deleteHistoryButton = document.getElementById('deleteHistoryButton');

    /* =========================================================
       APP DATA
    ========================================================= */
    let liveHistory = [];
    let savedWords = [];
    let finalHistory = [];
    let slotCursor = 0;
    let recentAcceptedKeys = [];
    const slots = [];
    let currentInterim = { original: '', translation: '', translatedOriginal: '', generation: 0, requestSequence: 0, appliedSequence: 0 };
    let interimTranslationTimer = null;

    /* =========================================================
       UI HELPERS
    ========================================================= */
    function showError(message) {
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function hideError() {
      errorElement.style.display = 'none';
      errorElement.textContent = '';
    }

    function setRecordStatus(state, text) {
      recordButton.className = '';
      recordButton.classList.add(state);
      recordStatus.textContent = text;
    }

    /* =========================================================
       TRANSLATION API
    ========================================================= */
    const translationCache = new Map();
    const pendingTranslations = new Map();

    function translateText(text, targetLang) {
      const cleanText = String(text || '').trim();
      if (!cleanText) return Promise.resolve('');

      const cacheKey = targetLang + ':' + cleanText.toLocaleLowerCase();
      if (translationCache.has(cacheKey)) return Promise.resolve(translationCache.get(cacheKey));
      if (pendingTranslations.has(cacheKey)) return pendingTranslations.get(cacheKey);

      const request = fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(cleanText)}`)
        .then(res => res.ok ? res.json() : Promise.reject(res.status))
        .then(data => {
          const translated = Array.isArray(data?.[0]) ? data[0].map(part => part?.[0] || '').join('') : '';
          translationCache.set(cacheKey, translated);
          return translated;
        })
        .catch(err => {
          console.error('Translation error:', err);
          return '';
        })
        .finally(() => pendingTranslations.delete(cacheKey));

      pendingTranslations.set(cacheKey, request);
      return request;
    }

    function cleanWordValue(word) {
      return String(word || '').trim().replace(/^[.,!?;:"'()[\]{}]+|[.,!?;:"'()[\]{}]+$/g, '');
    }

    function normalizeWord(word) {
      return cleanWordValue(word).toLocaleLowerCase();
    }

    /* =========================================================
       LANGUAGE SELECTORS
    ========================================================= */
    function fillLanguageSelects() {
      SPEECH_LANGUAGES.forEach(([name, code]) => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = `${name} — ${code}`;
        speechLanguageSelect.appendChild(opt);
      });
      TRANSLATION_LANGUAGES.forEach(([name, code]) => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = `${name} — ${code}`;
        translationLanguageSelect.appendChild(opt);
      });
    }

    function updateLanguageButton() {
      const spCode = speechLanguage.split('-')[0].toUpperCase();
      const trCode = translationLanguage.toUpperCase();
      languageButton.textContent = `${spCode} → ${trCode}`;
    }

    languageButton.addEventListener('click', () => {
      speechLanguageSelect.value = speechLanguage;
      translationLanguageSelect.value = translationLanguage;
      languageModal.classList.add('open');
    });

    closeLanguageModal.addEventListener('click', () => languageModal.classList.remove('open'));

    applyLanguages.addEventListener('click', () => {
      speechLanguage = speechLanguageSelect.value;
      translationLanguage = translationLanguageSelect.value;
      updateLanguageButton();
      languageModal.classList.remove('open');
      
      // Apply to active recognition if running
      if (recognition) recognition.lang = speechLanguage;
      if (shouldRecognize) restartRecognition();
    });

    /* =========================================================
       SAVED WORDS
    ========================================================= */
    function saveWord(word) {
      const clean = cleanWordValue(word);
      if (!clean) return;
      savedWords.push(clean);
      const el = document.createElement('span');
      el.textContent = clean;
      savedLinesElement.appendChild(el);
    }

    /* =========================================================
       12 SLOTS LOGIC
    ========================================================= */
    function createStableSlots() {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < SLOT_COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'stable-word';
        const num = document.createElement('span'); num.className = 'slot-number'; num.textContent = i + 1;
        const orig = document.createElement('span'); orig.className = 'stable-original'; orig.textContent = '—';
        const trans = document.createElement('span'); trans.className = 'stable-translation';
        card.append(num, orig, trans);
        
        const slot = { card, original: orig, translation: trans, word: '', key: '', version: 0 };
        card.addEventListener('click', () => { if (slot.word) saveWord(slot.word); });
        slots.push(slot);
        fragment.appendChild(card);
      }
      stableWordsElement.appendChild(fragment);
      updateCursorUI();
    }

    function updateCursorUI() {
      slots.forEach((s, i) => s.card.classList.toggle('cursor', i === slotCursor));
      cursorInfo.textContent = `next: ${slotCursor + 1}`;
    }

    function writeWordToNextSlot(word) {
      const clean = cleanWordValue(word);
      if (!clean) return;
      const key = normalizeWord(clean);
      if (recentAcceptedKeys.includes(key)) return;

      const slot = slots[slotCursor];
      slot.version++;
      const currentVersion = slot.version;
      slot.word = clean; slot.key = key;
      slot.original.textContent = clean;
      slot.translation.textContent = '...';

      recentAcceptedKeys.push(key);
      if (recentAcceptedKeys.length > DUPLICATE_WINDOW) recentAcceptedKeys.shift();

      slotCursor = (slotCursor + 1) % SLOT_COUNT;
      updateCursorUI();

      translateText(clean, translationLanguage).then(res => {
        if (slot.version === currentVersion) slot.translation.textContent = res;
      });
    }

    /* =========================================================
       LIVE FEED
    ========================================================= */
    let previousLiveText = '';
    
    function addRawLiveLine(words) {
      const cleaned = words.map(cleanWordValue).filter(Boolean);
      if (!cleaned.length) return;
      
      const liveKey = cleaned.join(' ').toLocaleLowerCase();
      if (liveKey === previousLiveText) return;
      previousLiveText = liveKey;

      const line = document.createElement('div');
      cleaned.forEach(w => {
        const span = document.createElement('span');
        span.textContent = w + ' ';
        span.addEventListener('click', () => saveWord(w));
        line.appendChild(span);
        
        writeWordToNextSlot(w);
        translateText(w, translationLanguage).then(res => {
          if (res) {
            const tSpan = document.createElement('span');
            tSpan.textContent = `(${res}) `;
            span.appendChild(tSpan);
          }
        });
      });

      newLineElement.prepend(line);
      while (newLineElement.children.length > LIVE_LINE_LIMIT) newLineElement.lastElementChild.remove();
    }

    /* =========================================================
       FINAL RESULT FEED
    ========================================================= */
    function createFinalElement(item, interim = false) {
      const wrap = document.createElement('div');
      wrap.className = interim ? 'final-entry interim' : 'final-entry';
      const lbl = document.createElement('div'); lbl.className = 'final-label'; lbl.textContent = interim ? 'Live interim' : 'Final';
      const orig = document.createElement('div'); orig.className = 'final-original'; orig.textContent = item.original || '';
      const trans = document.createElement('div'); trans.className = 'final-translation'; trans.textContent = item.translation || '…';
      wrap.append(lbl, orig, trans);
      return wrap;
    }

    function renderFinalHistory() {
      finalTextElement.innerHTML = '';
      if (currentInterim.original) finalTextElement.appendChild(createFinalElement(currentInterim, true));
      for (let i = finalHistory.length - 1; i >= 0; i--) {
        finalTextElement.appendChild(createFinalElement(finalHistory[i], false));
      }
    }

    function appendFinalHistory(text) {
      if (!text.trim()) return;
      currentInterim.original = ''; currentInterim.translation = '';
      
      const item = { original: text.trim(), translation: '' };
      finalHistory.push(item);
      if (finalHistory.length > 50) finalHistory.shift();
      renderFinalHistory();

      translateText(item.original, translationLanguage).then(res => {
        item.translation = res;
        renderFinalHistory();
      });
    }

    function updateLongInterim(text) {
      if (!text.trim() || text.trim() === currentInterim.original) return;
      currentInterim.original = text.trim();
      renderFinalHistory();

      if (interimTranslationTimer) clearTimeout(interimTranslationTimer);
      interimTranslationTimer = setTimeout(() => {
        translateText(currentInterim.original, translationLanguage).then(res => {
          currentInterim.translation = res;
          renderFinalHistory();
        });
      }, 400);
    }

    /* =========================================================
       MOBILE MENU
    ========================================================= */
    document.querySelectorAll('.menu-button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.menu-button, .column').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    /* =========================================================
       SPEECH RECOGNITION (CLEANED UP FOR MOBILE)
    ========================================================= */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let shouldRecognize = false;

    function createRecognition() {
      if (!SpeechRecognition) {
        showError('Speech Recognition is not supported by this browser.');
        setRecordStatus('error', 'Unsupported');
        return false;
      }
      
      recognition = new SpeechRecognition();
      // On mobile, continuous often breaks. But we leave it true and rely on auto-restart
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      
      recognition.onstart = () => {
        hideError();
        setRecordStatus('recording', 'Recording...');
      };
      
      recognition.onresult = (event) => {
        let longestInterim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = result[0].transcript.trim();
          if (!transcript) continue;
          
          if (result.isFinal) {
            appendFinalHistory(transcript);
          } else {
            if (transcript.length > longestInterim.length) longestInterim = transcript;
            const words = transcript.split(/\s+/).filter(Boolean);
            addRawLiveLine(words.slice(-LIVE_WORD_LIMIT));
          }
        }
        if (longestInterim) updateLongInterim(longestInterim);
      };
      
      recognition.onerror = (event) => {
        console.warn('Speech error:', event.error);
        if (event.error === 'not-allowed') {
          shouldRecognize = false;
          showError('Microphone permission blocked. Allow it in site settings.');
          setRecordStatus('error', 'Blocked');
        } else if (event.error === 'network') {
          // Temporarily stop, will try to restart on end
          setRecordStatus('starting', 'Network wait...');
        }
      };
      
      recognition.onend = () => {
        // Mobile browsers heavily rely on this to keep the loop going
        if (shouldRecognize) {
          setRecordStatus('starting', 'Restarting...');
          setTimeout(restartRecognition, 300); // Small delay prevents freezing Chrome
        } else {
          setRecordStatus('stopped', 'Stopped');
        }
      };
      return true;
    }

    function restartRecognition() {
      if (!shouldRecognize || !recognition) return;
      try {
        recognition.lang = speechLanguage;
        recognition.start();
      } catch (e) {
        // Ignore if already started
      }
    }

    // The single entry point for starting/stopping
    recordButton.addEventListener('click', () => {
      if (!SpeechRecognition) {
        showError('Speech API is not supported on this device/browser.');
        return;
      }
      
      if (!window.isSecureContext) {
         showError('HTTPS is required for microphone access on mobile.');
         return;
      }

      if (shouldRecognize) {
        // Turn OFF
        shouldRecognize = false;
        if (recognition) recognition.stop();
        setRecordStatus('stopped', 'Stopped');
      } else {
        // Turn ON
        shouldRecognize = true;
        hideError();
        if (!recognition) createRecognition();
        
        setRecordStatus('starting', 'Allow Mic...');
        restartRecognition();
      }
    });

    /* =========================================================
       INITIALIZATION
    ========================================================= */
    fillLanguageSelects();
    updateLanguageButton();
    createStableSlots();
    
    if (!window.isSecureContext) {
      showError('Use HTTPS to enable the microphone.');
    }
  </script>
</body>
</html>
