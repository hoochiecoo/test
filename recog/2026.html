<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Speech Recognition Translator</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #fff;
}

body {
  overflow: hidden;
}

button,
select {
  font: inherit;
}

.container {
  display: flex;
  width: 100%;
  height: 100dvh;
}

.column {
  flex: 1;
  height: 100dvh;
  padding: 12px;
  overflow-y: auto;
  border-right: 1px solid #ddd;
  -webkit-overflow-scrolling: touch;
}


/* =========================
   LIVE
========================= */

#liveTranslation {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.live-header {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 8px;

  padding: 8px 0;

  border-bottom: 1px solid #eee;
}

.live-title {
  margin: 0;

  font-size: 19px;

  white-space: nowrap;
}

.header-controls {
  display: flex;
  align-items: center;

  gap: 5px;

  min-width: 0;
}


/* =========================
   LANGUAGE
========================= */

#languageButton {
  flex: 0 1 auto;

  min-width: 66px;

  padding: 8px 10px;

  border: 1px solid #ddd;
  border-radius: 999px;

  background: #f5f5f5;
  color: #333;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;

  user-select: none;
  -webkit-tap-highlight-color: transparent;
}


/* =========================
   RECORD
========================= */

#recordButton {
  flex: 0 0 auto;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 6px;

  min-width: 92px;

  padding: 8px 10px;

  border: 1px solid #ddd;
  border-radius: 999px;

  background: #f5f5f5;
  color: #555;

  font-size: 11px;
  font-weight: 700;

  cursor: pointer;

  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.record-dot {
  width: 9px;
  height: 9px;

  flex: 0 0 auto;

  border-radius: 50%;

  background: #999;
}

#recordButton.ready {
  background: #eef9ee;
  border-color: #b9ddb9;
  color: #176117;
}

#recordButton.ready .record-dot {
  background: #35a535;
}

#recordButton.starting {
  background: #fffbe9;
  border-color: #e5d687;
  color: #796600;
}

#recordButton.starting .record-dot {
  background: #d7b600;
  animation: pulse 0.8s infinite;
}

#recordButton.recording {
  background: #fff4f4;
  border-color: #efb4b4;
  color: #b40000;
}

#recordButton.recording .record-dot {
  background: #e00000;
  animation: pulse 1s infinite;
}

#recordButton.stopped {
  background: #f5f5f5;
  border-color: #ddd;
  color: #666;
}

#recordButton.error {
  background: #fff1f1;
  border-color: #e5a4a4;
  color: #a00000;
}

#recordButton.error .record-dot {
  background: #c90000;
}

@keyframes pulse {
  0%   { opacity: 1; }
  50%  { opacity: .25; }
  100% { opacity: 1; }
}


/* =========================
   ERROR / DEBUG STATUS
========================= */

#error {
  display: none;

  padding: 7px;

  color: #a00000;

  font-size: 12px;
  font-weight: 700;

  text-align: center;

  background: #fff4f4;

  border-bottom: 1px solid #f2cccc;
}

#speechState {
  flex: 0 0 auto;

  min-height: 17px;

  padding: 3px 2px;

  color: #aaa;

  font-size: 10px;
  text-align: right;
}


/* =========================
   LIVE TOP
========================= */

#liveTop {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}

#new > div {
  padding: 7px 0;

  border-bottom: 1px solid #eee;

  line-height: 1.5;
}

#new span {
  cursor: pointer;
}


/* =========================
   LAST 12
========================= */

#stableArea {
  flex: 0 0 auto;

  width: 100%;

  padding: 5px 0 4px;

  border-top: 2px solid #ddd;

  background: #fafafa;
}

.stable-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 4px 3px 7px;

  color: #777;

  font-size: 11px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .04em;
}

#cursorInfo {
  color: #333;
}

#stableWords {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 4px;
}

.stable-word {
  position: relative;

  min-width: 0;
  min-height: 52px;

  padding: 6px 5px;

  overflow: hidden;

  background: #fff;

  border: 1px solid #e3e3e3;
  border-radius: 7px;

  cursor: pointer;
}

.stable-word.cursor {
  padding: 5px 4px;

  border: 2px solid #222;
}

.slot-number {
  position: absolute;

  top: 2px;
  right: 4px;

  color: #bbb;

  font-size: 9px;
}

.stable-original {
  display: block;

  width: calc(100% - 12px);

  overflow: hidden;

  font-size: 15px;
  font-weight: 700;
  line-height: 1.15;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.stable-translation {
  display: block;

  width: 100%;

  margin-top: 4px;

  overflow: hidden;

  color: #666;

  font-size: 12px;
  line-height: 1.15;

  text-overflow: ellipsis;
  white-space: nowrap;
}


/* =========================
   SAVED
========================= */

#savedLines {
  margin-top: 15px;

  line-height: 2;
}

#savedLines span {
  display: inline-block;

  margin-right: 8px;
  margin-bottom: 8px;

  padding: 7px 10px;

  background: #f2f2f2;

  border-radius: 8px;
}

#sortButton {
  padding: 10px 14px;

  border: 0;
  border-radius: 8px;

  background: #eee;

  cursor: pointer;
}


/* =========================
   FINAL
========================= */

#finalText {
  display: flex;
  flex-direction: column;

  gap: 10px;

  padding-bottom: 20px;
}

.final-entry {
  padding: 10px 0;

  border-bottom: 1px solid #eee;
}

.final-entry.interim {
  padding: 10px;

  background: #fafafa;

  border: 1px dashed #ddd;
  border-radius: 10px;
}

.final-label {
  margin-bottom: 4px;

  color: #999;

  font-size: 10px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .06em;
}

.final-entry.interim .final-label {
  color: #8c7a00;
}

.final-original {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.45;
}

.final-entry.interim .final-original {
  color: #555;
}

.final-translation {
  margin-top: 5px;

  color: #666;

  font-size: 15px;
  line-height: 1.45;
}

.final-translation.lagging {
  opacity: .82;
}

.translation-status {
  display: inline-block;

  margin-left: 7px;

  color: #aaa;

  font-size: 10px;

  vertical-align: middle;
}


/* =========================
   MODAL
========================= */

#languageModal {
  position: fixed;

  inset: 0;

  z-index: 5000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 16px;

  background: rgba(0, 0, 0, .42);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#languageModal.open {
  display: flex;
}

.modal-card {
  width: min(460px, 100%);

  max-height: calc(100dvh - 32px);

  overflow-y: auto;

  padding: 18px;

  background: #fff;

  border-radius: 16px;

  box-shadow:
    0 16px 50px rgba(0,0,0,.24);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.modal-header h3 {
  margin: 0;
}

#closeLanguageModal {
  width: 36px;
  height: 36px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: #f2f2f2;

  font-size: 20px;

  cursor: pointer;
}

.language-field {
  margin-bottom: 10px;
}

.language-field label {
  display: block;

  margin-bottom: 7px;

  color: #555;

  font-size: 13px;
  font-weight: 700;
}

.language-field select {
  width: 100%;

  padding: 12px;

  border: 1px solid #d8d8d8;
  border-radius: 10px;

  background: #fff;

  font-size: 16px;
}

.language-swap-wrap {
  display: flex;
  justify-content: center;

  padding: 3px 0 10px;
}

#swapLanguages {
  width: 46px;
  height: 40px;

  padding: 0;

  border: 1px solid #ddd;
  border-radius: 999px;

  background: #f4f4f4;

  font-size: 24px;
  font-weight: 700;

  cursor: pointer;
}

#applyLanguages {
  width: 100%;

  padding: 13px 16px;

  border: 0;
  border-radius: 11px;

  background: #111;
  color: #fff;

  font-weight: 700;

  cursor: pointer;
}

#deleteHistoryButton {
  width: 100%;

  margin-top: 10px;

  padding: 12px 16px;

  border: 1px solid #e5b1b1;
  border-radius: 11px;

  background: #fff5f5;
  color: #b00000;

  font-weight: 700;

  cursor: pointer;
}

.language-note {
  margin-top: 12px;

  color: #888;

  font-size: 12px;
  line-height: 1.4;
}


/* =========================
   MOBILE
========================= */

.mobile-menu {
  display: none;
}

@media (max-width: 768px) {
  .container {
    display: block;

    height:
      calc(
        100dvh -
        68px -
        env(safe-area-inset-bottom)
      );
  }

  .column {
    display: none;

    width: 100%;

    height:
      calc(
        100dvh -
        68px -
        env(safe-area-inset-bottom)
      );

    padding: 10px;

    border: 0;
  }

  .column.active {
    display: block;
  }

  #liveTranslation.active {
    display: flex;
  }

  .live-title {
    font-size: 16px;
  }

  #languageButton {
    min-width: 56px;

    padding: 7px 6px;

    font-size: 10px;
  }

  #recordButton {
    min-width: 76px;

    padding: 7px 6px;

    font-size: 10px;
  }

  #new > div {
    font-size: 17px;
  }

  .stable-word {
    min-height: 48px;
  }

  .stable-original {
    font-size: 14px;
  }

  .stable-translation {
    font-size: 11px;
  }

  #savedTranslations h2,
  #finalResult h2 {
    position: sticky;

    top: 0;

    z-index: 10;

    margin: 0;

    padding: 10px 0;

    background: #fff;

    border-bottom: 1px solid #eee;
  }

  .mobile-menu {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    display: flex;

    height:
      calc(
        68px +
        env(safe-area-inset-bottom)
      );

    padding-bottom:
      env(safe-area-inset-bottom);

    background:
      rgba(255,255,255,.96);

    border-top: 1px solid #ddd;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .mobile-menu button {
    flex: 1;

    border: 0;

    background: transparent;

    color: #777;

    font-size: 14px;
    font-weight: 600;
  }

  .mobile-menu button.active {
    background: #f3f3f3;
    color: #000;
  }

  #languageModal {
    align-items: flex-end;

    padding:
      12px
      12px
      calc(
        12px +
        env(safe-area-inset-bottom)
      );
  }

  .modal-card {
    width: 100%;
    max-height: 85dvh;

    border-radius: 18px;
  }
}
</style>
</head>

<div class="container">

  <!-- ======================
       LIVE
  ======================= -->

  <div
    class="column active"
    id="liveTranslation"
  >

    <div class="live-header">

      <h2 class="live-title">
        Live Translation
      </h2>

      <div class="header-controls">

        <button
          id="languageButton"
          type="button"
        >
          SR → RU
        </button>

        <button
          id="recordButton"
          class="ready"
          type="button"
        >
          <span class="record-dot"></span>

          <span id="recordStatus">
            Start
          </span>
        </button>

      </div>

    </div>

    <div id="error"></div>

    <div id="speechState">
      ready
    </div>

    <div id="liveTop">
      <div id="new"></div>
    </div>


    <div id="stableArea">

      <div class="stable-header">

        <span>
          Last 12 words
        </span>

        <span id="cursorInfo">
          next: 1
        </span>

      </div>

      <div id="stableWords"></div>

    </div>

  </div>


  <!-- ======================
       SAVED
  ======================= -->

  <div
    class="column"
    id="savedTranslations"
  >

    <h2>
      Saved Translations
    </h2>

    <button id="sortButton">
      Sort Alphabetically
    </button>

    <div id="savedLines"></div>

  </div>


  <!-- ======================
       FINAL
  ======================= -->

  <div
    class="column"
    id="finalResult"
  >

    <h2>
      Final Result
    </h2>

    <div id="finalText"></div>

  </div>

</div>


<!-- ======================
     MOBILE MENU
======================= -->

<nav class="mobile-menu">

  <button
    class="menu-button active"
    data-target="liveTranslation"
  >
    Live
  </button>

  <button
    class="menu-button"
    data-target="savedTranslations"
  >
    Saved
  </button>

  <button
    class="menu-button"
    data-target="finalResult"
  >
    Final
  </button>

</nav>


<!-- ======================
     LANGUAGE MODAL
======================= -->

<div id="languageModal">

      <h3>
        Languages
      </h3>

      <button
        id="closeLanguageModal"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="language-field">

      <label for="speechLanguageSelect">
        Speech recognition
      </label>

      <select id="speechLanguageSelect"></select>

    </div>


    <div class="language-swap-wrap">

      <button
        id="swapLanguages"
        type="button"
      >
        ⇄
      </button>

    </div>


    <div class="language-field">

      <label for="translationLanguageSelect">
        Translate to
      </label>

      <select id="translationLanguageSelect"></select>

    </div>


    <button
      id="applyLanguages"
      type="button"
    >
      Apply
    </button>


    <button
      id="deleteHistoryButton"
      type="button"
    >
      Delete history
    </button>


    <div class="language-note">
      Mobile mode uses short recognition sessions
      and automatically starts the next session.
    </div>

  </div>

</div>

function speechToTranslationCode(
  speechCode
) {
  if (
    speechCode === 'cmn-Hans-CN'
  ) {
    return 'zh-CN';
  }

  if (
    speechCode === 'cmn-Hant-TW' ||
    speechCode === 'yue-Hant-HK'
  ) {
    return 'zh-TW';
  }

  const base =
    String(
      speechCode || ''
    )
      .split('-')[0]
      .toLowerCase();

  return TRANSLATION_LANGUAGES.some(
    item =>
      item[1] === base
  )
    ? base
    : null;
}


function translationToSpeechCode(
  code
) {
  if (
    code === 'zh-CN'
  ) {
    return 'cmn-Hans-CN';
  }

  if (
    code === 'zh-TW'
  ) {
    return 'cmn-Hant-TW';
  }

  if (
    SPEECH_DEFAULTS[code]
  ) {
    return SPEECH_DEFAULTS[code];
  }

  const found =
    SPEECH_LANGUAGES.find(
      item =>
        item[1]
          .toLowerCase()
          .startsWith(
            String(code)
              .toLowerCase() +
            '-'
          )
    );

  return found
    ? found[1]
    : null;
}

function loadAllState() {

    STORAGE_KEY,

    'speechTranslationFullStateV6',
    'speechTranslationFullStateV5',
    'speechTranslationFullStateV4',

  for (

}


/* =========================================================
   TRANSLATION
========================================================= */

const translationCache =
  new Map();

const pendingTranslations =
  new Map();


function translateText(
  text,
  targetLang
) {
  const cleanText =
    String(
      text || ''
    ).trim();


  if (
    !cleanText
  ) {
    return Promise.resolve('');
  }


  const cacheKey =
    targetLang +
    ':' +
    cleanText.toLocaleLowerCase();


  if (
    translationCache.has(
      cacheKey
    )
  ) {
    return Promise.resolve(
      translationCache.get(
        cacheKey
      )
    );
  }


  if (
    pendingTranslations.has(
      cacheKey
    )
  ) {
    return pendingTranslations.get(
      cacheKey
    );
  }


  const request =
    fetch(
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(cleanText)}`
    )

    .then(
      response => {
        if (
          !response.ok
        ) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        return response.json();
      }
    )

    .then(
      data => {
        const translated =
          Array.isArray(
            data?.[0]
          )
            ? data[0]
                .map(
                  part =>
                    part?.[0] || ''
                )
                .join('')
            : '';


        translationCache.set(
          cacheKey,
          translated
        );


        return translated;
      }
    )

    .catch(
      error => {
        console.error(
          'Translation:',
          error
        );

        return '';
      }
    )

    .finally(
      () => {
        pendingTranslations.delete(
          cacheKey
        );
      }
    );


  pendingTranslations.set(
    cacheKey,
    request
  );


  return request;
}

function cleanWordValue(
  word
) {
  return String(
    word || ''

    .trim()
    .replace(
      /^[.,!?;:"'()[\]{}]+|[.,!?;:"'()[\]{}]+$/g,
      ''
    );
}


function normalizeWord(
  word
) {
  return cleanWordValue(
    word
  ).toLocaleLowerCase();
}

  for (

    const card =

    };

    );


    slots.push(

    );

    fragment.appendChild(

    );

  stableWordsElement.appendChild(

  );

  updateCursorUI();
}


function updateCursorUI() {
  for (
    let i = 0;
    i < SLOT_COUNT;
    i++
  ) {
    slots[i].card.classList.toggle(
      'cursor',
      i === slotCursor
    );
  }


  cursorInfo.textContent =
    `next: ${slotCursor + 1}`;
}


function duplicateRecently(
  key
) {
  return recentAcceptedKeys.includes(
    key
  );
}


function rememberAcceptedKey(
  key
) {
  recentAcceptedKeys.push(
    key
  );


  if (
    recentAcceptedKeys.length >
    DUPLICATE_WINDOW
  ) {
    recentAcceptedKeys.splice(
      0,
      recentAcceptedKeys.length -
      DUPLICATE_WINDOW
    );
  }
}


function writeWordToNextSlot(
  word
) {
  const clean =
    cleanWordValue(
      word
    );


  if (
    !clean
  ) {
    return;
  }


  const key =
    normalizeWord(
      clean
    );


  /*
    DUPLICATES BLOCKED ONLY
    ACROSS LAST 6 ACCEPTED WORDS.
  */
  if (
    duplicateRecently(
      key
    )
  ) {
    return;
  }


  const slot =
    slots[
      slotCursor
    ];


  slot.version++;


  const version =
    slot.version;


  slot.word =
    clean;

  slot.key =
    key;


  slot.original.textContent =
    clean;

  slot.translation.textContent =
    '...';


  rememberAcceptedKey(
    key
  );


  const targetSlot =
    slot;


  slotCursor =
    (
      slotCursor + 1
    ) % SLOT_COUNT;


  updateCursorUI();

  saveAllState();


  translateText(
    clean,
    translationLanguage
  )

  .then(
    translated => {
      if (
        targetSlot.version !==
        version
      ) {
        return;
      }


      targetSlot.translation.textContent =
        translated;

      saveAllState();
    }
  );
}


function clearSlots() {
  slotCursor = 0;

  recentAcceptedKeys = [];


  for (
    const slot
    of slots
  ) {
    slot.version++;

    slot.word = '';
    slot.key = '';

    slot.original.textContent =
      '—';

    slot.translation.textContent =
      '';
  }


  updateCursorUI();
}

function addRawLiveLine(
  words
) {
  const cleaned =
    words
      .map(
        cleanWordValue
      )
      .filter(Boolean);


  if (
    !cleaned.length
  ) {
    return;
  }


  const key =
    cleaned
      .join(' ')
      .toLocaleLowerCase();


  if (
    key ===
    previousLiveText
  ) {
    return;
  }


  previousLiveText =
    key;


  const item = {
    words:
      cleaned.map(
        word => ({
          word,
          translation: ''
        })
      )
  };


  liveHistory.unshift(
    item
  );


  if (
    liveHistory.length >
    LIVE_LINE_LIMIT
  ) {
    liveHistory.length =
      LIVE_LINE_LIMIT;
  }


  const line =
    document.createElement(
      'div'
    );


  for (
    const entry
    of item.words
  ) {
    const wordElement =
      document.createElement(
        'span'
      );


    wordElement.textContent =
      entry.word + ' ';


    wordElement.addEventListener(
      'click',
      () =>
        saveWord(
          entry.word
        )
    );


    line.appendChild(
      wordElement
    );


    writeWordToNextSlot(
      entry.word
    );


    translateText(
      entry.word,
      translationLanguage
    )

    .then(
      translated => {
        entry.translation =
          translated;


        if (
          translated &&
          wordElement.isConnected
        ) {
          const tr =
            document.createElement(
              'span'
            );

          tr.textContent =
            `(${translated}) `;

          wordElement.appendChild(
            tr
          );
        }


        saveAllState();
      }
    );
  }


  newLineElement.prepend(
    line
  );


  while (
    newLineElement.children.length >
    LIVE_LINE_LIMIT
  ) {
    newLineElement
      .lastElementChild
      .remove();
  }


  saveAllState();
}


/* =========================================================
   FINAL
========================================================= */

function countWords(
  text
) {
  return String(
    text || ''
  )
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}


function trimFinalHistory() {
  let total =
    finalHistory.reduce(
      (
        sum,
        item
      ) =>
        sum +
        countWords(
          item.original
        ),
      0
    );


  while (
    total >
      FINAL_HISTORY_LIMIT &&
    finalHistory.length >
      1
  ) {
    const removed =
      finalHistory.shift();


    total -=
      countWords(
        removed?.original
      );
  }
}


function createFinalElement(
  item,
  interim = false
) {
  const wrapper =
    document.createElement(
      'div'
    );


  wrapper.className =
    interim
      ? 'final-entry interim'
      : 'final-entry';


  const label =
    document.createElement(
      'div'
    );

  label.className =
    'final-label';

  label.textContent =
    interim
      ? 'Live interim'
      : 'Final';


  const original =
    document.createElement(
      'div'
    );

  original.className =
    'final-original';

  original.textContent =
    item.original || '';


  const translation =
    document.createElement(
      'div'
    );

  translation.className =
    'final-translation';


  if (
    item.translation
  ) {
    translation.textContent =
      item.translation;


    if (
      interim &&
      item.translatedOriginal &&
      item.translatedOriginal !==
      item.original
    ) {
      translation.classList.add(
        'lagging'
      );


      const mark =
        document.createElement(
          'span'
        );

      mark.className =
        'translation-status';

      mark.textContent =
        '↻';


      translation.appendChild(
        mark
      );
    }

  } else {
    translation.textContent =
      '…';
  }


  wrapper.append(
    label,
    original,
    translation
  );


  return wrapper;
}


function renderFinalHistory() {
  const fragment =
    document.createDocumentFragment();


  if (
    currentInterim.original
  ) {
    fragment.appendChild(
      createFinalElement(
        currentInterim,
        true
      )
    );
  }


  for (
    let i =
      finalHistory.length - 1;
    i >= 0;
    i--
  ) {
    fragment.appendChild(
      createFinalElement(
        finalHistory[i]
      )
    );
  }


  finalTextElement.replaceChildren(
    fragment
  );
}


/* =========================================================
   INTERIM TRANSLATION
========================================================= */

function clearCurrentInterim() {
  currentInterim.generation++;

  currentInterim.original =
    '';

  currentInterim.translation =
    '';

  currentInterim.translatedOriginal =
    '';

  currentInterim.requestSequence =
    0;

  currentInterim.appliedSequence =
    0;


  if (
    interimTranslationTimer
  ) {
    clearTimeout(
      interimTranslationTimer
    );

    interimTranslationTimer =
      null;
  }
}


function scheduleInterimTranslation(
  delay
) {
  if (
    interimTranslationTimer
  ) {
    clearTimeout(
      interimTranslationTimer
    );
  }


  interimTranslationTimer =
    setTimeout(
      () => {
        interimTranslationTimer =
          null;

        requestInterimTranslation();
      },
      delay
    );
}


function requestInterimTranslation() {
  const text =
    currentInterim.original;


  if (
    !text ||
    currentInterim.translatedOriginal ===
      text
  ) {
    return;
  }


  const generation =
    currentInterim.generation;


  const sequence =
    ++currentInterim.requestSequence;


  const target =
    translationLanguage;


  translateText(
    text,
    target
  )

  .then(
    translated => {
      if (
        generation !==
        currentInterim.generation
      ) {
        return;
      }


      if (
        !translated
      ) {
        return;
      }


      if (
        sequence <
        currentInterim.appliedSequence
      ) {
        return;
      }


      currentInterim.appliedSequence =
        sequence;

      currentInterim.translation =
        translated;

      currentInterim.translatedOriginal =
        text;


      renderFinalHistory();


      /*
        Recognition moved forward while
        translation was running.
      */
      if (
        currentInterim.original !==
        text
      ) {
        scheduleInterimTranslation(
          INTERIM_TRANSLATE_DELAY
        );
      }
    }
  );
}


function updateLongInterim(
  transcript
) {
  const text =
    String(
      transcript || ''
    ).trim();


  if (
    !text ||
    text ===
      currentInterim.original
  ) {
    return;
  }


  const alreadyTranslated =
    Boolean(
      currentInterim.translation
    );


  currentInterim.original =
    text;


  /*
    IMPORTANT:
    don't erase old actual translation.
  */
  renderFinalHistory();


  scheduleInterimTranslation(
    alreadyTranslated
      ? INTERIM_TRANSLATE_DELAY
      : FIRST_INTERIM_TRANSLATE_DELAY
  );
}


function appendFinalHistory(
  transcript
) {
  const text =
    String(
      transcript || ''
    ).trim();


  if (
    !text
  ) {
    return;
  }


  clearCurrentInterim();


  const item = {
    original:
      text,

    translation:
      '',

    targetLanguage:
      translationLanguage
  };


  finalHistory.push(
    item
  );


  trimFinalHistory();

  renderFinalHistory();

  saveAllState();


  const target =
    translationLanguage;


  translateText(
    text,
    target
  )

  .then(
    translated => {
      if (
        !finalHistory.includes(
          item
        )
      ) {
        return;
      }


      item.translation =
        translated;

      item.targetLanguage =
        target;


      renderFinalHistory();

      saveAllState();
    }
  );
}


/* =========================================================
   CREATE SLOTS
========================================================= */

createStableSlots();


/* =========================================================
   RESTORE
========================================================= */

const restoredState =
  loadAllState();


if (
  restoredState
) {
  if (
    typeof restoredState.speechLanguage ===
    'string'
  ) {
    speechLanguage =
      restoredState.speechLanguage;
  }


  if (
    typeof restoredState.translationLanguage ===
    'string'
  ) {
    translationLanguage =
      restoredState.translationLanguage;
  }


  if (
    Array.isArray(
      restoredState.liveHistory
    )
  ) {
    liveHistory =
      restoredState.liveHistory.slice(
        0,
        LIVE_LINE_LIMIT
      );
  }


  if (
    Array.isArray(
      restoredState.savedWords
    )
  ) {
    savedWords =
      restoredState.savedWords.filter(
        item =>
          typeof item ===
          'string'
      );
  }


  if (
    Array.isArray(
      restoredState.finalHistory
    )
  ) {
    if (
      restoredState.finalHistory.length &&
      typeof restoredState.finalHistory[0] ===
      'string'
    ) {
      const oldText =
        restoredState.finalHistory
          .filter(
            item =>
              typeof item ===
              'string'
          )
          .join(' ');


      if (
        oldText
      ) {
        finalHistory = [
          {
            original:
              oldText,

            translation:
              '',

            targetLanguage:
              translationLanguage
          }
        ];
      }

    } else {
      finalHistory =
        restoredState.finalHistory
          .filter(
            item =>
              item &&
              typeof item.original ===
              'string'
          )
          .map(
            item => ({
              original:
                item.original,

              translation:
                typeof item.translation ===
                'string'
                  ? item.translation
                  : '',

              targetLanguage:
                item.targetLanguage ||
                translationLanguage
            })
          );
    }


    trimFinalHistory();
  }


  if (
    Number.isInteger(
      restoredState.slotCursor
    )
  ) {
    slotCursor =
      (
        restoredState.slotCursor %
        SLOT_COUNT +
        SLOT_COUNT
      ) % SLOT_COUNT;
  }


  if (
    Array.isArray(
      restoredState.slots
    )
  ) {
    for (
      let i = 0;
      i < SLOT_COUNT;
      i++
    ) {
      const stored =
        restoredState.slots[i];


      if (
        !stored
      ) {
        continue;
      }


      const slot =
        slots[i];


      const word =
        typeof stored.word ===
        'string'
          ? stored.word
          : '';


      slot.word =
        word;

      slot.key =
        word
          ? normalizeWord(
              word
            )
          : '';


      slot.original.textContent =
        word || '—';


      slot.translation.textContent =
        typeof stored.translation ===
        'string'
          ? stored.translation
          : '';
    }
  }


  if (
    Array.isArray(
      restoredState.recentAcceptedKeys
    )
  ) {
    recentAcceptedKeys =
      restoredState.recentAcceptedKeys
        .filter(
          item =>
            typeof item ===
            'string' &&
            item
        )
        .slice(
          -DUPLICATE_WINDOW
        );

  } else {
    /*
      Migration from versions that did
      not save the last-six window.
    */
    const rebuilt = [];


    for (
      let offset =
        DUPLICATE_WINDOW;
      offset >= 1;
      offset--
    ) {
      const index =
        (
          slotCursor -
          offset +
          SLOT_COUNT
        ) % SLOT_COUNT;


      const key =
        slots[index]?.key;


      if (
        key
      ) {
        rebuilt.push(
          key
        );
      }
    }


    recentAcceptedKeys =
      rebuilt.slice(
        -DUPLICATE_WINDOW
      );
  }
}


fillLanguageSelects();

updateLanguageButton();

renderLiveHistory();

renderSavedWords();

renderFinalHistory();

updateCursorUI();


/* =========================================================
   RESTORE MISSING FINAL TRANSLATIONS
========================================================= */

for (
  const item
  of finalHistory
) {
  if (
    item.original &&
    !item.translation
  ) {
    const target =
      item.targetLanguage ||
      translationLanguage;


    translateText(
      item.original,
      target
    )

    .then(
      translated => {
        if (
          !finalHistory.includes(
            item
          )
        ) {
          return;
        }


        item.translation =
          translated;


        renderFinalHistory();

        saveAllState();
      }
    );
  }
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition =
  null;

let recognitionRunning =
  false;

let recognitionStarting =
  false;

let shouldRecognize =
  false;

let userActivatedRecognition =
  false;

let restartTimer =
  null;

let languageRestartPending =
  false;


/*
  This generation prevents an old
  onend from restarting after Stop.
*/
let recognitionGeneration =
  0;


/* =========================================================
   CREATE RECOGNITION
========================================================= */

function createRecognition() {
  if (
    !SpeechRecognition
  ) {
    return false;
  }


  recognition =
    new SpeechRecognition();


  /*
    Desktop:
    normal continuous recognition.

    Mobile:
    short sessions.
    onend automatically starts another one.

    This avoids relying on continuous=true
    on Android.
  */
  recognition.continuous =
    !IS_MOBILE;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.lang =
    speechLanguage;


  recognition.onstart =
    handleRecognitionStart;


  recognition.onaudiostart =
    () => {
      setSpeechState(
        'microphone audio active'
      );
  };


  recognition.onsoundstart =
    () => {
      setSpeechState(
        'sound detected'
      );
  };


  recognition.onspeechstart =
    () => {
      setSpeechState(
        'speech detected'
      );
  };


  recognition.onspeechend =
    () => {
      setSpeechState(
        'speech ended'
      );
  };


  recognition.onsoundend =
    () => {
      setSpeechState(
        'sound ended'
      );
  };


  recognition.onaudioend =
    () => {
      setSpeechState(
        'audio session ended'
      );
  };


  recognition.onnomatch =
    () => {
      setSpeechState(
        'speech heard, no match'
      );
  };


  recognition.onresult =
    handleRecognitionResult;


  recognition.onerror =
    handleRecognitionError;


  recognition.onend =
    handleRecognitionEnd;


  return true;
}


/* =========================================================
   RESTART
========================================================= */

function clearRestartTimer() {
  if (
    restartTimer !== null
  ) {
    clearTimeout(
      restartTimer
    );

    restartTimer =
      null;
  }
}


function scheduleRecognitionRestart(
  delay = RESTART_DELAY
) {
  if (
    !shouldRecognize ||
    !userActivatedRecognition
  ) {
    return;
  }


  if (
    document.visibilityState !==
    'visible'
  ) {
    return;
  }


  if (
    recognitionRunning ||
    recognitionStarting
  ) {
    return;
  }


  clearRestartTimer();


  const generation =
    recognitionGeneration;


  setRecordStatus(
    'starting',
    'Restart'
  );


  restartTimer =
    setTimeout(
      () => {
        restartTimer =
          null;


        if (
          generation !==
          recognitionGeneration
        ) {
          return;
        }


        startRecognitionInternal();

      },

      delay
    );
}


/* =========================================================
   START
========================================================= */

function startRecognitionInternal() {
  if (
    !shouldRecognize ||
    !userActivatedRecognition
  ) {
    return;
  }


  if (
    document.visibilityState !==
    'visible'
  ) {
    return;
  }


  if (
    recognitionRunning ||
    recognitionStarting
  ) {
    return;
  }


  if (
    !recognition
  ) {
    if (
      !createRecognition()
    ) {
      return;
    }
  }


  recognition.lang =
    speechLanguage;


  recognitionStarting =
    true;


  setRecordStatus(
    'starting',
    'Starting'
  );


  setSpeechState(
    IS_MOBILE
      ? 'mobile session starting'
      : 'recognition starting'
  );


  hideError();


  try {
    recognition.start();

  } catch (
    error
  ) {
    recognitionStarting =
      false;


    console.warn(
      'recognition.start:',
      error
    );


    /*
      InvalidStateError means the old
      engine may still be closing.

      Wait and try again.
    */
    scheduleRecognitionRestart(
      RESTART_RETRY_DELAY
    );
  }
}


/* =========================================================
   FIRST USER START
========================================================= */

function startFromUserClick() {
  if (
    !SpeechRecognition
  ) {
    setRecordStatus(
      'error',
      'Unsupported'
    );


    showError(
      'This Chrome version does not expose SpeechRecognition / webkitSpeechRecognition.'
    );


    return;
  }


  if (
    !window.isSecureContext
  ) {
    setRecordStatus(
      'error',
      'HTTPS'
    );


    showError(
      'This page is not in a secure context. On the phone open it through HTTPS, not http://192.168...'
    );


    return;
  }


  /*
    IMPORTANT:
    no getUserMedia here.

    SpeechRecognition itself opens
    the microphone.
  */

  userActivatedRecognition =
    true;


  shouldRecognize =
    true;


  recognitionGeneration++;


  hideError();


  if (
    !recognition
  ) {
    createRecognition();
  }


  /*
    Direct call from click handler.
  */
  startRecognitionInternal();
}


/* =========================================================
   MANUAL STOP
========================================================= */

function stopRecognitionManually() {
  shouldRecognize =
    false;


  languageRestartPending =
    false;


  recognitionGeneration++;


  clearRestartTimer();


  setRecordStatus(
    'stopped',
    'Stopped'
  );


  setSpeechState(
    'stopped by user'
  );


  if (
    recognition
  ) {
    try {
      recognition.abort();

    } catch (
      error
    ) {
      console.warn(
        'recognition.abort:',
        error
      );
    }
  }
}


/* =========================================================
   RECORD BUTTON
========================================================= */

recordButton.addEventListener(
  'click',
  () => {
    if (
      shouldRecognize
    ) {
      stopRecognitionManually();

      return;
    }


    startFromUserClick();
  }
);


/* =========================================================
   ON START
========================================================= */

function handleRecognitionStart() {
  recognitionRunning =
    true;


  recognitionStarting =
    false;


  languageRestartPending =
    false;


  clearRestartTimer();


  hideError();


  setRecordStatus(
    'recording',
    'Recording'
  );


  setSpeechState(
    IS_MOBILE
      ? 'recording · mobile session'
      : 'recording'
  );
}


/* =========================================================
   RESULTS
========================================================= */

function handleRecognitionResult(
  event
) {
  /*
    Process newly finalized results.
  */
  for (
    let i = event.resultIndex;
    i < event.results.length;
    i++
  ) {
    const result =
      event.results[i];


    if (
      !result?.[0]
    ) {
      continue;
    }


    const transcript =
      String(
        result[0].transcript || ''
      ).trim();


    if (
      !transcript
    ) {
      continue;
    }


    if (
      result.isFinal
    ) {
      appendFinalHistory(
        transcript
      );
    }
  }


  /*
    Build CURRENT interim from every
    non-final result currently held
    by the recognition engine.

    This is more reliable than only
    taking one result from resultIndex.
  */

  const interimParts = [];


  for (
    let i = 0;
    i < event.results.length;
    i++
  ) {
    const result =
      event.results[i];


    if (
      result?.isFinal ||
      !result?.[0]
    ) {
      continue;
    }


    const text =
      String(
        result[0].transcript || ''
      ).trim();


    if (
      text
    ) {
      interimParts.push(
        text
      );
    }
  }


  const fullInterim =
    interimParts
      .join(' ')
      .trim();


  if (
    fullInterim
  ) {
    updateLongInterim(
      fullInterim
    );


    const allWords =
      fullInterim
        .split(/\s+/)
        .filter(Boolean);


    /*
      LIVE remains short.
    */
    const rawWords =
      allWords.slice(
        -LIVE_WORD_LIMIT
      );


    addRawLiveLine(
      rawWords
    );
  }


  setSpeechState(
    'result received'
  );
}


/* =========================================================
   ERRORS
========================================================= */

function handleRecognitionError(
  event
) {
  const error =
    event.error || 'unknown';


  console.warn(
    'SpeechRecognition error:',
    error,
    event
  );


  setSpeechState(
    `error: ${error}`
  );


  /*
    IMPORTANT:
    don't pretend the engine is fully
    ended here.

    onend is authoritative.
  */

  recognitionStarting =
    false;


  if (
    error === 'not-allowed' ||
    error === 'service-not-allowed'
  ) {
    shouldRecognize =
      false;


    recognitionGeneration++;


    clearRestartTimer();


    setRecordStatus(
      'error',
      'Blocked'
    );


    showError(
      'Chrome blocked speech recognition. Open Chrome → Site settings → Microphone, allow this site, then press Start again.'
    );


    return;
  }


  if (
    error === 'audio-capture'
  ) {
    shouldRecognize =
      false;


    recognitionGeneration++;


    clearRestartTimer();


    setRecordStatus(
      'error',
      'No mic'
    );


    showError(
      'Chrome could not open the microphone. Check Android microphone permission for Chrome and close other apps using the microphone.'
    );


    return;
  }


  if (
    error === 'network'
  ) {
    setRecordStatus(
      'starting',
      'Network'
    );


    showError(
      'Speech recognition network error. Keep internet enabled; Chrome speech recognition may use a remote recognition service.'
    );


    return;
  }


  if (
    error === 'no-speech'
  ) {
    setRecordStatus(
      'starting',
      'Listening'
    );


    return;
  }


  if (
    error === 'aborted'
  ) {
    /*
      Normal when we manually abort
      or switch language.
    */
    return;
  }


  setRecordStatus(
    'starting',
    'Retry'
  );
}


/* =========================================================
   ON END
========================================================= */

function handleRecognitionEnd() {
  recognitionRunning =
    false;


  recognitionStarting =
    false;


  setSpeechState(
    'recognition session ended'
  );


  if (
    !shouldRecognize
  ) {
    setRecordStatus(
      'stopped',
      'Stopped'
    );

    return;
  }


  if (
    document.visibilityState !==
    'visible'
  ) {
    setRecordStatus(
      'stopped',
      'Paused'
    );

    return;
  }


  /*
    On Android this is the main
    continuous-recognition mechanism:
    short session -> onend -> restart.
  */
  scheduleRecognitionRestart(
    RESTART_DELAY
  );
}


/* =========================================================
   LANGUAGE CHANGE
========================================================= */

function restartForLanguageChange() {
  if (
    !shouldRecognize
  ) {
    return;
  }


  if (
    recognition
  ) {
    recognition.lang =
      speechLanguage;
  }


  if (
    recognitionRunning ||
    recognitionStarting
  ) {
    languageRestartPending =
      true;


    setRecordStatus(
      'starting',
      'Switching'
    );


    try {
      recognition.abort();

    } catch (
      error
    ) {
      recognitionRunning =
        false;

      recognitionStarting =
        false;

      scheduleRecognitionRestart();
    }


    return;
  }


  scheduleRecognitionRestart();
}


applyLanguages.addEventListener(
  'click',
  () => {
    const newSpeech =
      speechLanguageSelect.value;


    const newTranslation =
      translationLanguageSelect.value;


    const speechChanged =
      newSpeech !==
      speechLanguage;


    const translationChanged =
      newTranslation !==
      translationLanguage;


    speechLanguage =
      newSpeech;


    translationLanguage =
      newTranslation;


    updateLanguageButton();


    if (
      translationChanged
    ) {
      currentInterim.translation =
        '';

      currentInterim.translatedOriginal =
        '';

      currentInterim.appliedSequence =
        0;


      if (
        currentInterim.original
      ) {
        scheduleInterimTranslation(
          FIRST_INTERIM_TRANSLATE_DELAY
        );
      }
    }


    renderFinalHistory();

    saveAllState();


    languageModal.classList.remove(
      'open'
    );


    if (
      speechChanged
    ) {
      restartForLanguageChange();
    }
  }
);


/* =========================================================
   DELETE HISTORY
========================================================= */

deleteHistoryButton.addEventListener(
  'click',
  () => {
    const confirmed =
      confirm(
        'Delete Live, Last 12 words, Saved and Final history?'
      );


    if (
      !confirmed
    ) {
      return;
    }


    liveHistory = [];

    savedWords = [];

    finalHistory = [];

    previousLiveText = '';


    clearCurrentInterim();

    clearSlots();


    newLineElement.replaceChildren();

    savedLinesElement.replaceChildren();

    finalTextElement.replaceChildren();


    const keys = [
      STORAGE_KEY,

      'speechTranslationFullStateV8',
      'speechTranslationFullStateV7',
      'speechTranslationFullStateV6',
      'speechTranslationFullStateV5',
      'speechTranslationFullStateV4',
      'speechTranslationFullStateV3'
    ];


    for (
      const key
      of keys
    ) {
      try {
        localStorage.removeItem(
          key
        );
      } catch (
        error
      ) {}
    }


    /*
      Preserve languages.
    */
    saveAllState();


    languageModal.classList.remove(
      'open'
    );
  }
);


/* =========================================================
   MOBILE NAV
========================================================= */

const menuButtons =
  document.querySelectorAll(
    '.menu-button'
  );

const columns =
  document.querySelectorAll(
    '.column'
  );


menuButtons.forEach(
  button => {
    button.addEventListener(
      'click',
      () => {
        const target =
          button.dataset.target;


        columns.forEach(
          column =>
            column.classList.remove(
              'active'
            )
        );


        menuButtons.forEach(
          item =>
            item.classList.remove(
              'active'
            )
        );


        document
          .getElementById(
            target
          )
          .classList.add(
            'active'
          );


        button.classList.add(
          'active'
        );
      }
    );
  }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  'visibilitychange',
  () => {
    if (
      document.visibilityState ===
      'hidden'
    ) {
      saveAllState();

      return;
    }


    if (
      shouldRecognize &&
      userActivatedRecognition &&
      !recognitionRunning &&
      !recognitionStarting
    ) {
      scheduleRecognitionRestart(
        RESTART_DELAY
      );
    }
  }
);


window.addEventListener(
  'pageshow',
  () => {
    if (
      shouldRecognize &&
      userActivatedRecognition &&
      document.visibilityState ===
        'visible' &&
      !recognitionRunning &&
      !recognitionStarting
    ) {
      scheduleRecognitionRestart(
        RESTART_DELAY
      );
    }
  }
);


/* =========================================================
   SAVE / CLEANUP
========================================================= */

window.addEventListener(
  'pagehide',
  () => {
    saveAllState();
  }
);


window.addEventListener(
  'beforeunload',
  () => {
    saveAllState();


    shouldRecognize =
      false;


    recognitionGeneration++;


    clearRestartTimer();


    if (
      interimTranslationTimer
    ) {
      clearTimeout(
        interimTranslationTimer
      );
    }


    if (
      recognition
    ) {
      try {
        recognition.abort();
      } catch (
        error
      ) {}
    }
  }
);


/* =========================================================
   INITIAL STATUS
========================================================= */

if (
  !SpeechRecognition
) {
  setRecordStatus(
    'error',
    'Unsupported'
  );


  setSpeechState(
    'SpeechRecognition API missing'
  );


  showError(
    'SpeechRecognition / webkitSpeechRecognition is not available in this browser.'
  );

} else if (
  !window.isSecureContext
) {
  setRecordStatus(
    'error',
    'HTTPS'
  );


  setSpeechState(
    'insecure context'
  );


  showError(
    'Open this page through HTTPS. If you are opening http://192.168.x.x/... from your phone, microphone/speech APIs may not work.'
  );

} else {
  setRecordStatus(
    'ready',
    'Start'
  );


  setSpeechState(
    IS_MOBILE
      ? 'ready · mobile mode'
      : 'ready · desktop mode'
  );
}
</script>

</body>
</html>
