<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Speech Recognition with Translation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    body {
      overflow: hidden;
    }

    button,
    select {
      font: inherit;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100dvh;
    }

    .column {
      flex: 1;
      height: 100dvh;
      padding: 12px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      -webkit-overflow-scrolling: touch;
    }

    /* =========================
       LIVE
    ========================= */

    #liveTranslation {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .live-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 8px 0;

      border-bottom: 1px solid #eee;
    }

    .live-title {
      margin: 0;
      font-size: 20px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    /* =========================
       LANGUAGE BUTTON
    ========================= */

    #languageButton {
      flex: 0 1 auto;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 68px;
      max-width: 130px;

      padding: 8px 10px;

      border: 1px solid #ddd;
      border-radius: 999px;

      background: #f5f5f5;
      color: #333;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #languageButton:active {
      transform: scale(0.98);
    }

    /* =========================
       RECORD BUTTON
    ========================= */

    #recordButton {
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      min-width: 94px;

      padding: 8px 11px;

      border: 1px solid #ddd;
      border-radius: 999px;

      background: #f5f5f5;
      color: #555;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #recordButton:active {
      transform: scale(0.98);
    }

    .record-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #999;

      flex: 0 0 auto;
    }

    #recordButton.recording {
      background: #fff4f4;
      border-color: #efb4b4;
      color: #b40000;
    }

    #recordButton.recording .record-dot {
      background: #e00000;
      animation: pulse 1.1s infinite;
    }

    #recordButton.starting {
      background: #fffbe9;
      border-color: #e5d687;
      color: #7b6800;
    }

    #recordButton.starting .record-dot {
      background: #d7b600;
      animation: pulse 0.8s infinite;
    }

    #recordButton.stopped {
      background: #f5f5f5;
      border-color: #ddd;
      color: #666;
    }

    #recordButton.error {
      background: #fff1f1;
      border-color: #e5a4a4;
      color: #a00000;
    }

    #recordButton.error .record-dot {
      background: #cc0000;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }

      100% {
        opacity: 1;
      }
    }

    /* =========================
       RAW LIVE
    ========================= */

    #liveTop {
      flex: 1 1 auto;
      min-height: 0;

      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #new > div {
      padding: 7px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.5;
    }

    #new span {
      cursor: pointer;
    }

    /* =========================
       12 SLOTS
    ========================= */

    #stableArea {
      flex: 0 0 auto;

      width: 100%;

      padding: 5px 0 4px;

      border-top: 2px solid #ddd;

      background: #fafafa;
    }

    .stable-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 4px 3px 7px;

      font-size: 11px;
      font-weight: 700;

      color: #777;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #cursorInfo {
      color: #333;
    }

    #stableWords {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }

    .stable-word {
      position: relative;

      min-width: 0;
      min-height: 52px;

      padding: 6px 5px;

      overflow: hidden;

      background: #fff;

      border: 1px solid #e3e3e3;
      border-radius: 7px;

      cursor: pointer;
    }

    .stable-word.cursor {
      border: 2px solid #222;
      padding: 5px 4px;
    }

    .slot-number {
      position: absolute;
      top: 2px;
      right: 4px;

      font-size: 9px;
      color: #bbb;
    }

    .stable-original {
      display: block;

      width: calc(100% - 12px);

      font-size: 15px;
      font-weight: 700;
      line-height: 1.15;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stable-translation {
      display: block;

      width: 100%;

      margin-top: 4px;

      font-size: 12px;
      line-height: 1.15;

      color: #666;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       SAVED
    ========================= */

    #savedLines {
      margin-top: 15px;
      line-height: 2;
    }

    #savedLines span {
      display: inline-block;

      margin-right: 8px;
      margin-bottom: 8px;

      padding: 7px 10px;

      background: #f2f2f2;
      border-radius: 8px;
    }

    #sortButton {
      padding: 10px 14px;

      border: 0;
      border-radius: 8px;

      background: #eee;

      cursor: pointer;
    }

    /* =========================
       FINAL
    ========================= */

    #finalText {
      display: flex;
      flex-direction: column;
      gap: 10px;

      padding-bottom: 20px;
    }

    .final-entry {
      padding: 10px 0;

      border-bottom: 1px solid #eee;
    }

    .final-entry.interim {
      padding: 10px;

      background: #fafafa;

      border: 1px dashed #ddd;
      border-radius: 10px;
    }

    .final-label {
      margin-bottom: 4px;

      font-size: 10px;
      font-weight: 700;

      color: #999;

      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .final-entry.interim .final-label {
      color: #8c7a00;
    }

    .final-original {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.45;
    }

    .final-entry.interim .final-original {
      color: #555;
    }

    .final-translation {
      margin-top: 5px;

      font-size: 15px;
      line-height: 1.45;

      color: #666;
    }

    .final-translation.lagging {
      opacity: 0.82;
    }

    .translation-status {
      display: inline-block;

      margin-left: 7px;

      font-size: 10px;
      font-weight: 400;

      color: #aaa;

      vertical-align: middle;
    }

    /* =========================
       ERROR
    ========================= */

    #error {
      color: red;
      font-weight: bold;

      padding: 8px;

      text-align: center;
    }

    /* =========================
       MODAL
    ========================= */

    #languageModal {
      position: fixed;
      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 16px;

      background: rgba(0, 0, 0, 0.42);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #languageModal.open {
      display: flex;
    }

    .modal-card {
      width: min(460px, 100%);

      max-height: calc(100dvh - 32px);

      overflow-y: auto;

      padding: 18px;

      background: #fff;

      border-radius: 16px;

      box-shadow:
        0 16px 50px rgba(0, 0, 0, 0.24);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 18px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
    }

    #closeLanguageModal {
      width: 36px;
      height: 36px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: #f2f2f2;

      font-size: 20px;
      line-height: 1;

      cursor: pointer;
    }

    .language-field {
      margin-bottom: 10px;
    }

    .language-field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #555;
    }

    .language-field select {
      width: 100%;

      padding: 12px;

      border: 1px solid #d8d8d8;
      border-radius: 10px;

      background: #fff;

      font-size: 16px;
    }

    .language-swap-wrap {
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 3px 0 10px;
    }

    #swapLanguages {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 46px;
      height: 40px;

      padding: 0;

      border: 1px solid #ddd;
      border-radius: 999px;

      background: #f4f4f4;
      color: #222;

      font-size: 24px;
      font-weight: 700;

      cursor: pointer;
    }

    #applyLanguages {
      width: 100%;

      padding: 13px 16px;

      border: 0;
      border-radius: 11px;

      background: #111;
      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    #deleteHistoryButton {
      width: 100%;

      margin-top: 10px;

      padding: 12px 16px;

      border: 1px solid #e5b1b1;
      border-radius: 11px;

      background: #fff5f5;
      color: #b00000;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .language-note {
      margin-top: 12px;

      font-size: 12px;
      line-height: 1.4;

      color: #888;
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
      }

      .container {
        display: block;

        height:
          calc(
            100dvh -
            68px -
            env(safe-area-inset-bottom)
          );
      }

      .column {
        display: none;

        width: 100%;

        height:
          calc(
            100dvh -
            68px -
            env(safe-area-inset-bottom)
          );

        padding: 10px;

        border: 0;
      }

      .column.active {
        display: block;
      }

      #liveTranslation.active {
        display: flex;
      }

      .live-header {
        padding: 6px 0;
      }

      .live-title {
        font-size: 17px;
      }

      .header-controls {
        gap: 4px;
      }

      #languageButton {
        min-width: 58px;
        max-width: 92px;

        padding: 7px 8px;

        font-size: 10px;
      }

      #recordButton {
        min-width: 82px;

        padding: 7px 8px;

        font-size: 10px;
      }

      #new > div {
        padding: 7px 0;

        font-size: 17px;
        line-height: 1.5;
      }

      #stableWords {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      .stable-word {
        min-height: 48px;
        padding: 5px;
      }

      .stable-word.cursor {
        padding: 4px 3px;
      }

      .stable-original {
        font-size: 14px;
      }

      .stable-translation {
        margin-top: 3px;
        font-size: 11px;
      }

      .final-original {
        font-size: 17px;
      }

      .final-translation {
        font-size: 15px;
      }

      #savedTranslations h2,
      #finalResult h2 {
        position: sticky;
        top: 0;

        z-index: 10;

        margin: 0;

        padding: 10px 0;

        background: #fff;

        border-bottom: 1px solid #eee;
      }

      .mobile-menu {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        z-index: 1000;

        display: flex;

        height:
          calc(
            68px +
            env(safe-area-inset-bottom)
          );

        padding-bottom:
          env(safe-area-inset-bottom);

        background:
          rgba(255, 255, 255, 0.96);

        border-top: 1px solid #ddd;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .mobile-menu button {
        flex: 1;

        border: 0;

        background: transparent;

        font-size: 14px;
        font-weight: 600;

        color: #777;

        cursor: pointer;
      }

      .mobile-menu button.active {
        color: #000;
        background: #f3f3f3;
      }

      #languageModal {
        align-items: flex-end;

        padding:
          12px
          12px
          calc(
            12px +
            env(safe-area-inset-bottom)
          );
      }

      .modal-card {
        width: 100%;
        max-height: 85dvh;

        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div
      class="column active"
      id="liveTranslation"
    >

      <div class="live-header">

        <h2 class="live-title">
          Live Translation
        </h2>

        <div class="header-controls">

          <button
            id="languageButton"
            type="button"
          >
            SR → RU
          </button>

          <button
            id="recordButton"
            class="stopped"
            type="button"
          >
            <span class="record-dot"></span>

            <span id="recordStatus">
              Stopped
            </span>
          </button>

        </div>

      </div>


      <div id="liveTop">
        <div id="new"></div>
      </div>


      <div id="stableArea">

        <div class="stable-header">

          <span>
            Last 12 words
          </span>

          <span id="cursorInfo">
            next: 1
          </span>

        </div>

        <div id="stableWords"></div>

      </div>

    </div>


    <div
      class="column"
      id="savedTranslations"
    >

      <h2>
        Saved Translations
      </h2>

      <button id="sortButton">
        Sort Alphabetically
      </button>

      <div id="savedLines"></div>

    </div>


    <div
      class="column"
      id="finalResult"
    >

      <h2>
        Final Result
      </h2>

      <div id="finalText"></div>

    </div>

  </div>


  <nav class="mobile-menu">

    <button
      class="menu-button active"
      data-target="liveTranslation"
    >
      Live
    </button>

    <button
      class="menu-button"
      data-target="savedTranslations"
    >
      Saved
    </button>

    <button
      class="menu-button"
      data-target="finalResult"
    >
      Final
    </button>

  </nav>


  <div id="languageModal">

    <div class="modal-card">

      <div class="modal-header">

        <h3>
          Languages
        </h3>

        <button
          id="closeLanguageModal"
          type="button"
        >
          ×
        </button>

      </div>


      <div class="language-field">

        <label for="speechLanguageSelect">
          Speech recognition
        </label>

        <select id="speechLanguageSelect"></select>

      </div>


      <div class="language-swap-wrap">

        <button
          id="swapLanguages"
          type="button"
          title="Swap languages"
        >
          ⇄
        </button>

      </div>


      <div class="language-field">

        <label for="translationLanguageSelect">
          Translate to
        </label>

        <select id="translationLanguageSelect"></select>

      </div>


      <button
        id="applyLanguages"
        type="button"
      >
        Apply
      </button>


      <button
        id="deleteHistoryButton"
        type="button"
      >
        Delete history
      </button>


      <div class="language-note">
        Interim translation may lag slightly behind recognition to reduce network load.
      </div>

    </div>

  </div>

    function speechToTranslationCode(
      speechCode
    ) {

      const code =
        String(
          speechCode || ''
        );


      if (
        code === 'cmn-Hans-CN'
      ) {
        return 'zh-CN';
      }


      if (
        code === 'cmn-Hant-TW' ||
        code === 'yue-Hant-HK'
      ) {
        return 'zh-TW';
      }


      const base =
        code
          .split('-')[0]
          .toLowerCase();


      const exists =
        TRANSLATION_LANGUAGES.some(
          item =>
            item[1] === base
        );


      return exists
        ? base
        : null;

    }


    function translationToSpeechCode(
      translationCode
    ) {

      const code =
        String(
          translationCode || ''
        );


      if (
        code === 'zh-CN'
      ) {
        return 'cmn-Hans-CN';
      }


      if (
        code === 'zh-TW'
      ) {
        return 'cmn-Hant-TW';
      }


      if (
        SPEECH_DEFAULTS[
          code
        ]
      ) {

        return SPEECH_DEFAULTS[
          code
        ];

      }


      const found =
        SPEECH_LANGUAGES.find(
          item =>
            item[1]
              .toLowerCase()
              .startsWith(
                code.toLowerCase() +
                '-'
              )
        );


      return found
        ? found[1]
        : null;

    }

    /* =========================

    ========================== */

    const translationCache =
      new Map();

    const pendingTranslations =
      new Map();


    function translateText(
      text,
      targetLang
    ) {

      const cleanText =
        String(
          text || ''
        ).trim();


      if (
        !cleanText
      ) {

        return Promise.resolve(
          ''
        );

      }


      const cacheKey =
        targetLang +
        ':' +
        cleanText.toLocaleLowerCase();


      if (
        translationCache.has(
          cacheKey
        )
      ) {

        return Promise.resolve(
          translationCache.get(
            cacheKey
          )
        );

      }


      if (
        pendingTranslations.has(
          cacheKey
        )
      ) {

        return pendingTranslations.get(
          cacheKey
        );

      }


      const request =
        fetch(
          `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(cleanText)}`
        )

        .then(
          response => {

            if (
              !response.ok
            ) {

              throw new Error(
                `Translation HTTP ${response.status}`
              );

            }


            return response.json();

          }
        )

        .then(
          data => {

            const translated =
              Array.isArray(
                data?.[0]
              )
                ? data[0]
                    .map(
                      part =>
                        part?.[0] || ''
                    )
                    .join('')
                : '';


            translationCache.set(
              cacheKey,
              translated
            );


            pendingTranslations.delete(
              cacheKey
            );


            return translated;

          }
        )

        .catch(
          error => {

            pendingTranslations.delete(
              cacheKey
            );


            console.error(
              'Translation error:',
              error
            );


            return '';

          }
        );


      pendingTranslations.set(
        cacheKey,
        request
      );


      return request;

    }


    function translateWord(
      word,
      targetLang
    ) {

      return translateText(
        word,
        targetLang
      );

    }

    function countFinalWords() {

      let count =
        0;


      for (
        const item
        of finalHistory
      ) {

        if (
          !item ||
          typeof item.original !==
          'string'
        ) {
          continue;
        }


        count +=
          item.original
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

      }


      return count;

    }


    function trimFinalHistory() {

      let total =
        countFinalWords();


      while (
        total >
          FINAL_HISTORY_LIMIT &&
        finalHistory.length >
          1
      ) {

        const removed =
          finalHistory.shift();


        if (
          removed &&
          typeof removed.original ===
          'string'
        ) {

          total -=
            removed.original
              .trim()
              .split(/\s+/)
              .filter(Boolean)
              .length;

        }

      }

    }

    /* =========================
       INTERIM TRANSLATION
    ========================== */

    function clearCurrentInterim() {

      currentInterim.generation++;


      currentInterim.original =
        '';


      currentInterim.translation =
        '';


      currentInterim.translatedOriginal =
        '';


      currentInterim.requestSequence =
        0;


      currentInterim.appliedSequence =
        0;


      if (
        interimTranslationTimer
      ) {

        clearTimeout(
          interimTranslationTimer
        );


        interimTranslationTimer =
          null;

      }

    }


    function requestInterimTranslation() {

      const textToTranslate =
        currentInterim.original;


      if (
        !textToTranslate
      ) {
        return;
      }


      if (
        currentInterim.translatedOriginal ===
        textToTranslate
      ) {
        return;
      }


      const generation =
        currentInterim.generation;


      const sequence =
        ++currentInterim.requestSequence;


      const targetAtRequest =
        translationLanguage;


      translateText(
        textToTranslate,
        targetAtRequest
      )

      .then(
        translated => {

          if (
            generation !==
            currentInterim.generation
          ) {
            return;
          }


          if (
            !currentInterim.original
          ) {
            return;
          }


          if (
            !translated
          ) {
            return;
          }


          if (
            sequence <
            currentInterim.appliedSequence
          ) {
            return;
          }


          currentInterim.appliedSequence =
            sequence;


          currentInterim.translation =
            translated;


          currentInterim.translatedOriginal =
            textToTranslate;


          renderFinalHistory();


          if (
            currentInterim.original !==
            textToTranslate
          ) {

            scheduleInterimTranslation(
              INTERIM_TRANSLATE_DELAY
            );

          }

        }
      );

    }


    function scheduleInterimTranslation(
      delay
    ) {

      if (
        interimTranslationTimer
      ) {

        clearTimeout(
          interimTranslationTimer
        );

      }


      interimTranslationTimer =
        setTimeout(
          () => {

            interimTranslationTimer =
              null;


            requestInterimTranslation();

          },

          delay
        );

    }


    function updateLongInterim(
      transcript
    ) {

      const cleanTranscript =
        String(
          transcript || ''
        ).trim();


      if (
        !cleanTranscript
      ) {
        return;
      }


      if (
        cleanTranscript ===
        currentInterim.original
      ) {
        return;
      }


      const hadTranslation =
        Boolean(
          currentInterim.translation
        );


      currentInterim.original =
        cleanTranscript;


      renderFinalHistory();


      scheduleInterimTranslation(
        hadTranslation
          ? INTERIM_TRANSLATE_DELAY
          : FIRST_INTERIM_TRANSLATE_DELAY
      );

    }


    function appendFinalHistory(
      transcript
    ) {

      const cleanTranscript =
        String(
          transcript || ''
        ).trim();


      if (
        !cleanTranscript
      ) {
        return;
      }


      clearCurrentInterim();


      const item = {

        original:
          cleanTranscript,

        translation:
          '',

        targetLanguage:
          translationLanguage

      };


      finalHistory.push(
        item
      );


      trimFinalHistory();


      renderFinalHistory();


      saveAllState();


      const targetAtCreation =
        translationLanguage;


      translateText(
        cleanTranscript,
        targetAtCreation
      )

      .then(
        translated => {

          if (
            !finalHistory.includes(
              item
            )
          ) {
            return;
          }


          item.translation =
            translated;


          item.targetLanguage =
            targetAtCreation;


          renderFinalHistory();


          saveAllState();

        }
      );

    }


    /* =========================
       SLOTS
    ========================== */

    function createStableSlots() {

      const fragment =
        document.createDocumentFragment();


      for (
        let i = 0;
        i < SLOT_COUNT;
        i++
      ) {

        const card =
          document.createElement(
            'div'

        card.className =
          'stable-word';


        const number =
          document.createElement(
            'span'
          );


        number.className =
          'slot-number';


        number.textContent =
          i + 1;


        const original =
          document.createElement(
            'span'

        original.className =
          'stable-original';


        original.textContent =
          '—';


        const translation =
          document.createElement(
            'span'
          );


        translation.className =
          'stable-translation';


        card.appendChild(
          number
        );


        card.appendChild(
          original
        );


        card.appendChild(
          translation
        );


        const slot = {

          card,
          original,
          translation,

          word: '',
          key: '',

          version: 0

        };


        card.addEventListener(
          'click',
          () => {

            if (
              slot.word
            ) {

              saveWord(
                slot.word
              );

            }

          }
        );


        slots.push(
          slot
        );


        fragment.appendChild(
          card
        );

      }


      stableWordsElement.appendChild(
        fragment
      );


      updateCursorUI();

    }


    function updateCursorUI() {

      for (
        let i = 0;
        i < slots.length;
        i++
      ) {

        slots[i].card.classList.toggle(
          'cursor',
          i === slotCursor
        );

      }


      cursorInfo.textContent =
        `next: ${slotCursor + 1}`;

    }


    /*
      Теперь duplicate check
      НЕ смотрит все 12 slots.

      Только последние 6
      принятых слов.
    */

    function wordAlreadyExistsRecently(
      key
    ) {

      return recentAcceptedKeys.includes(
        key
      );

    }


    function rememberAcceptedWord(
      key
    ) {

      recentAcceptedKeys.push(
        key
      );


      if (
        recentAcceptedKeys.length >
        DUPLICATE_WINDOW
      ) {

        recentAcceptedKeys.splice(
          0,
          recentAcceptedKeys.length -
          DUPLICATE_WINDOW
        );

      }

    }


    function clearSlots() {

      slotCursor =
        0;


      recentAcceptedKeys =
        [];


      for (
        const slot
        of slots
      ) {

        slot.version++;


        slot.word =
          '';


        slot.key =
          '';


        slot.original.textContent =
          '—';


        slot.translation.textContent =
          '';

      }


      updateCursorUI();

    }


    function writeWordToNextSlot(
      word
    ) {

      const cleanWord =
        cleanWordValue(
          word
        );


      if (
        !cleanWord
      ) {
        return;
      }


      const key =
        normalizeWord(
          cleanWord
        );


      /*
        ВАЖНО:

        если слово было среди
        последних 6 ПРИНЯТЫХ слов,
        игнорируем.

        Но если оно есть в 12 slots,
        однако уже вышло из последних 6,
        его можно записать снова.
      */

      if (
        wordAlreadyExistsRecently(
          key
        )
      ) {
        return;
      }


      const slot =
        slots[
          slotCursor
        ];


      slot.version++;


      const currentVersion =
        slot.version;


      slot.word =
        cleanWord;


      slot.key =
        key;


      slot.original.textContent =
        cleanWord;


      slot.translation.textContent =
        '...';


      /*
        Запоминаем как принятое слово
        ДО перехода курсора.
      */

      rememberAcceptedWord(
        key
      );


      const targetSlot =
        slot;


      slotCursor =
        (
          slotCursor + 1
        ) % SLOT_COUNT;


      updateCursorUI();


      saveAllState();


      translateWord(
        cleanWord,
        translationLanguage
      )

      .then(
        translated => {

          if (
            targetSlot.version !==
            currentVersion
          ) {
            return;
          }


          targetSlot.translation.textContent =
            translated;


          saveAllState();

        }
      );

    }


    /* =========================
       LIVE HISTORY
    ========================== */

    let previousLiveText =
      '';


    function createLiveLineElement(
      item
    ) {

      const lineElement =
        document.createElement(
          'div'
        );


      if (
        !item ||
        !Array.isArray(
          item.words
        )
      ) {

        return lineElement;

      }


      for (
        const entry
        of item.words
      ) {

        if (
          !entry ||
          typeof entry.word !==
          'string'
        ) {

          continue;

        }


        const word =
          entry.word;


        const wordElement =
          document.createElement(
            'span'
          );


        wordElement.textContent =
          word + ' ';


        lineElement.appendChild(
          wordElement
        );


        wordElement.addEventListener(
          'click',
          () => {

            saveWord(
              word
            );

          }
        );


        if (
          entry.translation
        ) {

          const translationElement =
            document.createElement(
              'span'
            );


          translationElement.textContent =
            `(${entry.translation}) `;


          wordElement.appendChild(
            translationElement
          );

        }

      }


      return lineElement;

    }


    function renderLiveHistory() {

      const fragment =
        document.createDocumentFragment();


      for (
        const item
        of liveHistory
      ) {

        fragment.appendChild(
          createLiveLineElement(
            item
          )
        );

      }


      newLineElement.replaceChildren(
        fragment
      );

    }


    function addRawLiveLine(
      rawWords
    ) {

      if (
        !rawWords ||
        rawWords.length === 0
      ) {
        return;
      }


      const cleanedWords =
        rawWords
          .map(
            cleanWordValue
          )
          .filter(Boolean);


      if (
        cleanedWords.length === 0
      ) {
        return;
      }


      const liveKey =
        cleanedWords
          .join(' ')
          .toLocaleLowerCase();


      if (
        liveKey ===
        previousLiveText
      ) {
        return;
      }


      previousLiveText =
        liveKey;


      const historyItem = {

        words:
          cleanedWords.map(
            word => ({
              word,
              translation: ''
            })
          )

      };


      liveHistory.unshift(
        historyItem
      );


      if (
        liveHistory.length >
        LIVE_LINE_LIMIT
      ) {

        liveHistory.length =
          LIVE_LINE_LIMIT;

      }


      const lineElement =
        document.createElement(
          'div'
        );


      historyItem.words.forEach(
        entry => {

          const word =
            entry.word;


          const wordElement =
            document.createElement(
              'span'
            );


          wordElement.textContent =
            word + ' ';


          lineElement.appendChild(
            wordElement
          );


          wordElement.addEventListener(
            'click',
            () => {

              saveWord(
                word
              );

            }
          );


          writeWordToNextSlot(
            word
          );


          translateWord(
            word,
            translationLanguage
          )

          .then(
            translated => {

              entry.translation =
                translated;


              const translationElement =
                document.createElement(
                  'span'
                );


              translationElement.textContent =
                translated
                  ? `(${translated}) `
                  : '';


              wordElement.appendChild(
                translationElement
              );


              saveAllState();

            }
          );

        }
      );


      newLineElement.prepend(
        lineElement
      );


      while (
        newLineElement.children.length >
        LIVE_LINE_LIMIT
      ) {

        newLineElement
          .lastElementChild
          .remove();

      }


      saveAllState();

    }


    /* =========================
       INITIAL SLOTS
    ========================== */

    createStableSlots();


    /* =========================
       RESTORE
    ========================== */

    const restoredState =
      loadAllState();


    if (
      restoredState
    ) {

      if (
        typeof restoredState.speechLanguage ===
        'string'
      ) {

        speechLanguage =
          restoredState.speechLanguage;

      }


      if (
        typeof restoredState.translationLanguage ===
        'string'
      ) {

        translationLanguage =
          restoredState.translationLanguage;

      }


      if (
        Array.isArray(
          restoredState.liveHistory
        )
      ) {

        liveHistory =
          restoredState.liveHistory.slice(
            0,
            LIVE_LINE_LIMIT
          );

      }


      if (
        Array.isArray(
          restoredState.savedWords
        )
      ) {

        savedWords =
          restoredState.savedWords.filter(
            word =>
              typeof word ===
              'string'
          );

      }


      if (
        Array.isArray(
          restoredState.finalHistory
        )
      ) {

        if (
          restoredState.finalHistory.length > 0 &&
          typeof restoredState.finalHistory[0] ===
          'string'
        ) {

          const oldText =
            restoredState.finalHistory
              .filter(
                value =>
                  typeof value ===
                  'string'
              )
              .join(' ');


          if (
            oldText
          ) {

            finalHistory = [
              {
                original:
                  oldText,

                translation:
                  '',

                targetLanguage:
                  translationLanguage
              }
            ];

          }

        } else {

          finalHistory =
            restoredState.finalHistory
              .filter(
                item =>
                  item &&
                  typeof item.original ===
                  'string'
              )
              .map(
                item => ({

                  original:
                    item.original,

                  translation:
                    typeof item.translation ===
                    'string'
                      ? item.translation
                      : '',

                  targetLanguage:
                    item.targetLanguage ||
                    translationLanguage

                })
              );

        }


        trimFinalHistory();

      }


      if (
        Number.isInteger(
          restoredState.slotCursor
        )
      ) {

        slotCursor =
          restoredState.slotCursor %
          SLOT_COUNT;


        if (
          slotCursor < 0
        ) {

          slotCursor =
            0;

        }

      }


      if (
        Array.isArray(
          restoredState.slots
        )
      ) {

        for (
          let i = 0;
          i < SLOT_COUNT;
          i++
        ) {

          const storedSlot =
            restoredState.slots[
              i
            ];


          const slot =
            slots[
              i
            ];


          if (
            !storedSlot ||
            typeof storedSlot !==
            'object'
          ) {

            continue;

          }


          const word =
            typeof storedSlot.word ===
            'string'
              ? storedSlot.word
              : '';


          const translation =
            typeof storedSlot.translation ===
            'string'
              ? storedSlot.translation
              : '';


          slot.word =
            word;


          slot.key =
            word
              ? normalizeWord(
                  word
                )
              : '';


          slot.original.textContent =
            word || '—';


          slot.translation.textContent =
            translation;

        }

      }


      /*
        Новая версия уже хранит
        recentAcceptedKeys напрямую.
      */

      if (
        Array.isArray(
          restoredState.recentAcceptedKeys
        )
      ) {

        recentAcceptedKeys =
          restoredState.recentAcceptedKeys
            .filter(
              key =>
                typeof key ===
                'string' &&
                key
            )
            .slice(
              -DUPLICATE_WINDOW
            );

      } else {

        /*
          Старые версии localStorage
          такого массива не имеют.

          Восстанавливаем последние 6
          по позиции cursor в кольце.
        */

        const reconstructed =
          [];


        for (
          let offset =
            DUPLICATE_WINDOW;
          offset >= 1;
          offset--
        ) {

          const index =
            (
              slotCursor -
              offset +
              SLOT_COUNT
            ) % SLOT_COUNT;


          const key =
            slots[
              index
            ]?.key;


          if (
            key
          ) {

            reconstructed.push(
              key
            );

          }

        }


        recentAcceptedKeys =
          reconstructed.slice(
            -DUPLICATE_WINDOW
          );

      }

    }


    recognition.lang =
      speechLanguage;


    fillLanguageSelects();

    updateLanguageButton();

    renderLiveHistory();

    renderSavedWords();

    renderFinalHistory();

    updateCursorUI();


    /* =========================
       RESTORE FINAL TRANSLATIONS
    ========================== */

    for (
      const item
      of finalHistory
    ) {

      if (
        !item.translation &&
        item.original
      ) {

        const target =
          item.targetLanguage ||
          translationLanguage;


        translateText(
          item.original,
          target
        )

        .then(
          translated => {

            if (
              !finalHistory.includes(
                item
              )
            ) {
              return;
            }


            item.translation =
              translated;


            renderFinalHistory();


            saveAllState();

          }
        );

      }

    }


    /* =========================
       RECOGNITION STATE
    ========================== */

    let recognitionRunning =
      false;

    let recognitionStarting =
      false;

    let shouldRecognize =
      true;

    let restartTimer =
      null;

    let microphoneReady =
      false;

    let microphoneStream =
      null;

    let languageRestartPending =
      false;


    function clearRestartTimer() {

      if (
        restartTimer !== null
      ) {

        clearTimeout(
          restartTimer
        );


        restartTimer =
          null;

      }

    }


    function scheduleRecognitionRestart(
      delay = RESTART_DELAY
    ) {

      if (
        !shouldRecognize ||
        !microphoneReady
      ) {
        return;
      }


      clearRestartTimer();


      setRecordStatus(
        'starting',
        'Restarting'
      );


      restartTimer =
        setTimeout(
          () => {

            restartTimer =
              null;


            startRecognition();

          },

          delay
        );

    }


    function startRecognition() {

      if (
        !shouldRecognize
      ) {
        return;
      }


      if (
        !microphoneReady
      ) {

        setRecordStatus(
          'stopped',
          'No mic'
        );


        return;

      }


      if (
        recognitionRunning ||
        recognitionStarting
      ) {
        return;
      }


      recognitionStarting =
        true;


      recognition.lang =
        speechLanguage;


      setRecordStatus(
        'starting',
        'Starting'
      );


      try {

        recognition.start();

      } catch (
        error
      ) {

        recognitionStarting =
          false;


        console.warn(
          'Recognition start failed:',
          error
        );


        scheduleRecognitionRestart(
          RESTART_RETRY_DELAY
        );

      }

    }


    function stopRecognitionManually() {

      shouldRecognize =
        false;


      languageRestartPending =
        false;


      clearRestartTimer();


      recognitionStarting =
        false;


      setRecordStatus(
        'stopped',
        'Stopped'
      );


      try {

        recognition.stop();

      } catch (
        error
      ) {

        console.warn(
          'Recognition stop:',
          error
        );

      }

    }


    function resumeRecognitionManually() {

      shouldRecognize =
        true;


      hideError();


      startRecognition();

    }


    function restartRecognitionForLanguageChange() {

      if (
        !shouldRecognize
      ) {

        recognition.lang =
          speechLanguage;


        return;

      }


      if (
        recognitionRunning ||
        recognitionStarting
      ) {

        languageRestartPending =
          true;


        setRecordStatus(
          'starting',
          'Switching'
        );


        try {

          recognition.stop();

        } catch (
          error
        ) {

          languageRestartPending =
            false;


          recognitionRunning =
            false;


          recognitionStarting =
            false;


          scheduleRecognitionRestart(
            RESTART_DELAY
          );

        }


        return;

      }


      recognition.lang =
        speechLanguage;


      scheduleRecognitionRestart(
        RESTART_DELAY
      );

    }


    /* =========================
       LANG APPLY
    ========================== */

    applyLanguages.addEventListener(
      'click',
      () => {

        const newSpeechLanguage =
          speechLanguageSelect.value;


        const newTranslationLanguage =
          translationLanguageSelect.value;


        const speechChanged =
          newSpeechLanguage !==
          speechLanguage;


        const translationChanged =
          newTranslationLanguage !==
          translationLanguage;


        speechLanguage =
          newSpeechLanguage;


        translationLanguage =
          newTranslationLanguage;


        if (
          translationChanged
        ) {

          currentInterim.translation =
            '';


          currentInterim.translatedOriginal =
            '';


          currentInterim.appliedSequence =
            0;


          if (
            currentInterim.original
          ) {

            scheduleInterimTranslation(
              FIRST_INTERIM_TRANSLATE_DELAY
            );

          }

        }


        updateLanguageButton();


        renderFinalHistory();


        saveAllState();


        closeLanguageSelector();


        if (
          speechChanged
        ) {

          restartRecognitionForLanguageChange();

        }

      }
    );


    /* =========================
       DELETE
    ========================== */

    deleteHistoryButton.addEventListener(
      'click',
      () => {

        const confirmed =
          window.confirm(
            'Delete Live, Last 12 words, Saved and Final history?'
          );


        if (
          !confirmed
        ) {
          return;
        }


        liveHistory =
          [];


        savedWords =
          [];


        finalHistory =
          [];


        previousLiveText =
          '';


        clearCurrentInterim();


        clearSlots();


        newLineElement.replaceChildren();


        savedLinesElement.replaceChildren();


        finalTextElement.replaceChildren();


        try {

          const keys = [
            STORAGE_KEY,
            'speechTranslationFullStateV6',
            'speechTranslationFullStateV5',
            'speechTranslationFullStateV4',
            'speechTranslationFullStateV3'
          ];


          for (
            const key
            of keys
          ) {

            localStorage.removeItem(
              key
            );

          }

        } catch (
          error
        ) {

          console.warn(
            'localStorage clear error:',
            error
          );

        }


        saveAllState();


        closeLanguageSelector();

      }
    );


    /* =========================
       RECORD BUTTON
    ========================== */

    recordButton.addEventListener(
      'click',
      () => {

        if (
          shouldRecognize &&
          (
            recognitionRunning ||
            recognitionStarting
          )
        ) {

          stopRecognitionManually();


          return;

        }


        resumeRecognitionManually();

      }
    );


    /* =========================
       RECOGNITION EVENTS
    ========================== */

    recognition.onstart =
      () => {

        recognitionRunning =
          true;


        recognitionStarting =
          false;


        languageRestartPending =
          false;


        clearRestartTimer();


        hideError();


        setRecordStatus(
          'recording',
          'Recording'
        );

      };


    recognition.onresult =
      event => {

        let longestInterim =
          '';


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const result =
            event.results[i];


          if (
            !result ||
            !result[0]
          ) {
            continue;
          }


          const transcript =
            result[0]
              .transcript
              .trim();


          if (
            !transcript
          ) {
            continue;
          }


          /* FINAL */

          if (
            result.isFinal
          ) {

            appendFinalHistory(
              transcript
            );


            continue;

          }


          /* LONG INTERIM */

          if (
            transcript.length >
            longestInterim.length
          ) {

            longestInterim =
              transcript;

          }


          /* SHORT LIVE */

          const allWords =
            transcript
              .split(/\s+/)
              .filter(Boolean);


          const rawWords =
            allWords.slice(
              -LIVE_WORD_LIMIT
            );


          addRawLiveLine(
            rawWords
          );

        }


        if (
          longestInterim
        ) {

          updateLongInterim(
            longestInterim
          );

        }

      };


    recognition.onend =
      () => {

        recognitionRunning =
          false;


        recognitionStarting =
          false;


        if (
          !shouldRecognize
        ) {

          setRecordStatus(
            'stopped',
            'Stopped'
          );


          return;

        }


        if (
          languageRestartPending
        ) {

          languageRestartPending =
            false;


          recognition.lang =
            speechLanguage;


          scheduleRecognitionRestart(
            RESTART_DELAY
          );


          return;

        }


        scheduleRecognitionRestart(
          RESTART_DELAY
        );

      };


    recognition.onerror =
      event => {

        recognitionRunning =
          false;


        recognitionStarting =
          false;


        console.warn(
          'Recognition error:',
          event.error
        );


        if (
          event.error ===
            'not-allowed' ||
          event.error ===
            'service-not-allowed'
        ) {

          shouldRecognize =
            false;


          clearRestartTimer();


          setRecordStatus(
            'error',
            'Blocked'
          );


          showError(
            `Speech recognition error: ${event.error}`
          );


          return;

        }


        if (
          event.error ===
          'audio-capture'
        ) {

          shouldRecognize =
            false;


          clearRestartTimer();


          setRecordStatus(
            'error',
            'No mic'
          );


          showError(
            'Speech recognition error: microphone is unavailable'
          );


          return;

        }


        if (
          event.error ===
          'no-speech'
        ) {

          setRecordStatus(
            'starting',
            'Listening'
          );


          return;

        }


        setRecordStatus(
          'starting',
          'Retrying'
        );


        scheduleRecognitionRestart(
          RESTART_RETRY_DELAY
        );

      };


    /* =========================
       MICROPHONE
    ========================== */

    navigator.mediaDevices
      .getUserMedia({
        audio: true
      })

      .then(
        stream => {

          microphoneReady =
            true;


          microphoneStream =
            stream;


          window.__speechMicStream =
            stream;


          shouldRecognize =
            true;


          startRecognition();

        }
      )

      .catch(
        error => {

          microphoneReady =
            false;


          shouldRecognize =
            false;


          console.error(
            'Microphone error:',
            error
          );


          setRecordStatus(
            'error',
            'No mic'
          );


          showError(
            `Microphone error: ${error.message}`
          );

        }
      );


    /* =========================
       RESTORE TAB
    ========================== */

    document.addEventListener(
      'visibilitychange',
      () => {

        if (
          document.visibilityState ===
          'hidden'
        ) {

          saveAllState();


          return;

        }


        if (
          shouldRecognize &&
          microphoneReady &&
          !recognitionRunning &&
          !recognitionStarting
        ) {

          scheduleRecognitionRestart(
            RESTART_DELAY
          );

        }

      }
    );


    window.addEventListener(
      'pageshow',
      () => {

        if (
          shouldRecognize &&
          microphoneReady &&
          !recognitionRunning &&
          !recognitionStarting
        ) {

          scheduleRecognitionRestart(
            RESTART_DELAY
          );

        }

      }
    );


    window.addEventListener(
      'focus',
      () => {

        if (
          shouldRecognize &&
          microphoneReady &&
          !recognitionRunning &&
          !recognitionStarting
        ) {

          scheduleRecognitionRestart(
            RESTART_DELAY
          );

        }

      }
    );


    /* =========================
       SORT
    ========================== */

    sortButton.addEventListener(
      'click',
      () => {

        savedWords.sort(
          (a, b) =>
            a.localeCompare(b)
        );


        renderSavedWords();


        saveAllState();

      }
    );


    /* =========================
       MOBILE MENU
    ========================== */

    const menuButtons =
      document.querySelectorAll(
        '.menu-button'
      );


    const columns =
      document.querySelectorAll(
        '.column'
      );


    menuButtons.forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            const targetId =
              button.dataset.target;


            columns.forEach(
              column => {

                column.classList.remove(
                  'active'
                );

              }
            );


            menuButtons.forEach(
              btn => {

                btn.classList.remove(
                  'active'
                );

              }
            );


            document
              .getElementById(
                targetId
              )
              .classList.add(
                'active'
              );


            button.classList.add(
              'active'
            );


            if (
              shouldRecognize &&
              microphoneReady &&
              !recognitionRunning &&
              !recognitionStarting
            ) {

              scheduleRecognitionRestart(
                RESTART_DELAY
              );

            }

          }
        );

      }
    );


    /* =========================
       CLEANUP
    ========================== */

    window.addEventListener(
      'pagehide',
      () => {

        saveAllState();

      }
    );


    window.addEventListener(
      'beforeunload',
      () => {

        saveAllState();


        shouldRecognize =
          false;


        clearRestartTimer();


        if (
          interimTranslationTimer
        ) {

          clearTimeout(
            interimTranslationTimer
          );

        }


        try {

          recognition.abort();

        } catch (
          error
        ) {
        }


        if (
          microphoneStream
        ) {

          microphoneStream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        }

      }
    );


    window.onerror =
      message => {

        console.error(
          'Window error:',
          message
        );

      };

  </script>

</body>
</html>
