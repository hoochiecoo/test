<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <!-- PWA настройки окна -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Translator">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">

  <title>Speech Recognition Translator</title>

  <!-- Иконка для iOS и Android (Векторная SVG, зашифрованная в base64 для работы из одного файла) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23111'%3E%3Cpath d='M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z'/%3E%3C/svg%3E">

  <!-- PWA Манифест (JSON, зашифрованный в URL для работы из одного файла) -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Speech%20Translator%22%2C%22short_name%22%3A%22Translator%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27%2523111%27%253E%253Cpath%20d%3D%27M12.87%2015.07l-2.54-2.51.03-.03c1.74-1.94%202.98-4.17%203.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5%207.92%2010.44%209.75%209%2011.35%208.07%2010.32%207.3%209.19%206.69%208h-2c.73%201.63%201.73%203.17%202.98%204.56l-5.09%205.02L4%2019l5-5%203.11%203.11.76-2.04zM18.5%2010h-2L12%2022h2l1.12-3h4.75L21%2022h2l-4.5-12zm-2.62%207l1.62-4.33L19.12%2017h-3.24z%27%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; background: #fff;
    }
    body { overflow: hidden; }
    button, select { font: inherit; }
    .container { display: flex; width: 100%; height: 100dvh; }
    .column {
      flex: 1; height: 100dvh; padding: 12px; overflow-y: auto; border-right: 1px solid #ddd; -webkit-overflow-scrolling: touch;
    }

    /* =========================
       LIVE
    ========================= */
    #liveTranslation { display: flex; flex-direction: column; overflow: hidden; }
    .live-header {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee;
    }
    .live-title { margin: 0; font-size: 20px; white-space: nowrap; }
    .header-controls { display: flex; align-items: center; gap: 5px; min-width: 0; }

    /* =========================
       INSTALL APP BUTTON
    ========================= */
    #installAppBtn {
      display: none; /* Скрыто по умолчанию, показывается через JS */
      align-items: center; justify-content: center;
      padding: 8px 10px;
      border: none; border-radius: 999px;
      background: #007aff; color: #fff;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #installAppBtn:active { transform: scale(0.98); }

    /* =========================
       LANGUAGE BUTTON
    ========================= */
    #languageButton {
      flex: 0 1 auto; display: inline-flex; align-items: center; justify-content: center;
      min-width: 68px; max-width: 120px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 999px;
      background: #f5f5f5; color: #333; font-size: 12px; font-weight: 700; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #languageButton:active { transform: scale(0.98); }

    /* =========================
       RECORD BUTTON
    ========================= */
    #recordButton {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-width: 94px; padding: 8px 11px; border: 1px solid #ddd; border-radius: 999px;
      background: #f5f5f5; color: #555; font-size: 12px; font-weight: 700; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #recordButton:active { transform: scale(0.98); }
    .record-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: #999; }
    
    #recordButton.recording { background: #fff4f4; border-color: #efb4b4; color: #b40000; }
    #recordButton.recording .record-dot { background: #e00000; animation: pulse 1.1s infinite; }
    #recordButton.starting { background: #fffbe9; border-color: #e5d687; color: #7b6800; }
    #recordButton.starting .record-dot { background: #d7b600; animation: pulse 0.8s infinite; }
    #recordButton.stopped { background: #f5f5f5; border-color: #ddd; color: #666; }
    #recordButton.ready { background: #eef9ee; border-color: #b9ddb9; color: #176117; }
    #recordButton.ready .record-dot { background: #35a535; }
    #recordButton.error { background: #fff1f1; border-color: #e5a4a4; color: #a00000; }
    #recordButton.error .record-dot { background: #cc0000; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* =========================
       LIVE TOP
    ========================= */
    #liveTop { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #new > div { padding: 7px 0; border-bottom: 1px solid #eee; line-height: 1.5; }
    #new span { cursor: pointer; }

    /* =========================
       12 WORDS
    ========================= */
    #stableArea { flex: 0 0 auto; width: 100%; padding: 5px 0 4px; border-top: 2px solid #ddd; background: #fafafa; }
    .stable-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 3px 7px; color: #777; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    #cursorInfo { color: #333; }
    #stableWords { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; }
    .stable-word { position: relative; min-width: 0; min-height: 52px; padding: 6px 5px; overflow: hidden; background: #fff; border: 1px solid #e3e3e3; border-radius: 7px; cursor: pointer; }
    .stable-word.cursor { border: 2px solid #222; padding: 5px 4px; }
    .slot-number { position: absolute; top: 2px; right: 4px; color: #bbb; font-size: 9px; }
    .stable-original { display: block; width: calc(100% - 12px); overflow: hidden; font-size: 15px; font-weight: 700; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
    .stable-translation { display: block; width: 100%; margin-top: 4px; overflow: hidden; color: #666; font-size: 12px; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }

    /* =========================
       SAVED
    ========================= */
    #savedLines { margin-top: 15px; line-height: 2; }
    #savedLines span { display: inline-block; margin-right: 8px; margin-bottom: 8px; padding: 7px 10px; background: #f2f2f2; border-radius: 8px; }
    #sortButton { padding: 10px 14px; border: 0; border-radius: 8px; background: #eee; cursor: pointer; }

    /* =========================
       FINAL
    ========================= */
    #finalText { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    .final-entry { padding: 10px 0; border-bottom: 1px solid #eee; }
    .final-entry.interim { padding: 10px; background: #fafafa; border: 1px dashed #ddd; border-radius: 10px; }
    .final-label { margin-bottom: 4px; color: #999; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .final-entry.interim .final-label { color: #8c7a00; }
    .final-original { font-size: 17px; font-weight: 600; line-height: 1.45; }
    .final-entry.interim .final-original { color: #555; }
    .final-translation { margin-top: 5px; color: #666; font-size: 15px; line-height: 1.45; }
    .final-translation.lagging { opacity: 0.82; }
    .translation-status { display: inline-block; margin-left: 7px; color: #aaa; font-size: 10px; font-weight: 400; vertical-align: middle; }

    /* =========================
       ERROR
    ========================= */
    #error { display: none; padding: 8px; color: red; font-size: 12px; font-weight: bold; text-align: center; }

    /* =========================
       MODAL
    ========================= */
    #languageModal { position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    #languageModal.open { display: flex; }
    .modal-card { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px; background: #fff; border-radius: 16px; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.24); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-header h3 { margin: 0; font-size: 20px; }
    #closeLanguageModal { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: #f2f2f2; font-size: 20px; cursor: pointer; }
    .language-field { margin-bottom: 10px; }
    .language-field label { display: block; margin-bottom: 7px; color: #555; font-size: 13px; font-weight: 700; }
    .language-field select { width: 100%; padding: 12px; background: #fff; border: 1px solid #d8d8d8; border-radius: 10px; font-size: 16px; }
    .language-swap-wrap { display: flex; align-items: center; justify-content: center; padding: 3px 0 10px; }
    #swapLanguages { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 40px; padding: 0; border: 1px solid #ddd; border-radius: 999px; background: #f4f4f4; color: #222; font-size: 24px; font-weight: 700; cursor: pointer; }
    #applyLanguages { width: 100%; padding: 13px 16px; border: 0; border-radius: 11px; background: #111; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    #deleteHistoryButton { width: 100%; margin-top: 10px; padding: 12px 16px; border: 1px solid #e5b1b1; border-radius: 11px; background: #fff5f5; color: #b00000; font-size: 14px; font-weight: 700; cursor: pointer; }
    .language-note { margin-top: 12px; color: #888; font-size: 12px; line-height: 1.4; }

    /* =========================
       MOBILE
    ========================= */
    .mobile-menu { display: none; }
    @media (max-width: 768px) {
      body { overflow: hidden; }
      .container { display: block; height: calc(100dvh - 68px - env(safe-area-inset-bottom)); }
      .column { display: none; width: 100%; height: calc(100dvh - 68px - env(safe-area-inset-bottom)); padding: 10px; border: 0; }
      .column.active { display: block; }
      #liveTranslation.active { display: flex; }
      .live-header { padding: 6px 0; }
      .live-title { font-size: 16px; }
      .header-controls { gap: 4px; }
      #languageButton { min-width: 57px; max-width: 82px; padding: 7px 7px; font-size: 10px; }
      #recordButton { min-width: 78px; padding: 7px 7px; font-size: 10px; }
      #new > div { padding: 7px 0; font-size: 17px; line-height: 1.5; }
      #stableWords { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stable-word { min-height: 48px; padding: 5px; }
      .stable-word.cursor { padding: 4px 3px; }
      .stable-original { font-size: 14px; }
      .stable-translation { margin-top: 3px; font-size: 11px; }
      #savedTranslations h2, #finalResult h2 { position: sticky; top: 0; z-index: 10; margin: 0; padding: 10px 0; background: #fff; border-bottom: 1px solid #eee; }
      .mobile-menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: flex; height: calc(68px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255, 255, 255, 0.96); border-top: 1px solid #ddd; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .mobile-menu button { flex: 1; border: 0; background: transparent; color: #777; font-size: 14px; font-weight: 600; cursor: pointer; }
      .mobile-menu button.active { background: #f3f3f3; color: #000; }
      #languageModal { align-items: flex-end; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
      .modal-card { width: 100%; max-height: 85dvh; border-radius: 18px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LIVE -->
    <div class="column active" id="liveTranslation">
      <div class="live-header">
        <h2 class="live-title">Live Translation</h2>
        <div class="header-controls">
          <!-- Кнопка установки PWA (покажется, если доступно) -->
          <button id="installAppBtn" type="button">⬇ App</button>
          
          <button id="languageButton" type="button">SR → RU</button>
          <button id="recordButton" class="ready" type="button">
            <span class="record-dot"></span>
            <span id="recordStatus">Start</span>
          </button>
        </div>
      </div>
      <div id="error"></div>
      <div id="liveTop">
        <div id="new"></div>
      </div>
      <div id="stableArea">
        <div class="stable-header">
          <span>Last 12 words</span>
          <span id="cursorInfo">next: 1</span>
        </div>
        <div id="stableWords"></div>
      </div>
    </div>

    <!-- SAVED -->
    <div class="column" id="savedTranslations">
      <h2>Saved Translations</h2>
      <button id="sortButton">Sort Alphabetically</button>
      <div id="savedLines"></div>
    </div>

    <!-- FINAL -->
    <div class="column" id="finalResult">
      <h2>Final Result</h2>
      <div id="finalText"></div>
    </div>

  </div>

  <!-- MOBILE MENU -->
  <nav class="mobile-menu">
    <button class="menu-button active" data-target="liveTranslation">Live</button>
    <button class="menu-button" data-target="savedTranslations">Saved</button>
    <button class="menu-button" data-target="finalResult">Final</button>
  </nav>

  <!-- LANG MODAL -->
  <div id="languageModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Languages</h3>
        <button id="closeLanguageModal" type="button">×</button>
      </div>

      <div class="language-field">
        <label for="speechLanguageSelect">Speech recognition</label>
        <select id="speechLanguageSelect"></select>
      </div>

      <div class="language-swap-wrap">
        <button id="swapLanguages" type="button" title="Swap languages">⇄</button>
      </div>

      <div class="language-field">
        <label for="translationLanguageSelect">Translate to</label>
        <select id="translationLanguageSelect"></select>
      </div>

      <button id="applyLanguages" type="button">Apply</button>
      <button id="deleteHistoryButton" type="button">Delete history</button>

      <div class="language-note">
        On mobile, press Start once to allow microphone access.
        After that automatic recognition restart is enabled.
      </div>
    </div>
  </div>

  <script>

    /* =========================================================
       PWA INSTALL LOGIC
    ========================================================= */
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Предотвращаем появление стандартной мини-панели Android
      e.preventDefault();
      // Сохраняем событие для вызова по кнопке
      deferredPrompt = e;
      // Показываем нашу кнопку в шапке
      installAppBtn.style.display = 'inline-flex';
    });

    installAppBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      // Показываем системное окно установки
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installAppBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installAppBtn.style.display = 'none';
      deferredPrompt = null;
    });

    /* =========================================================
       SETTINGS
    ========================================================= */

    const LIVE_WORD_LIMIT = 2;
    const LIVE_LINE_LIMIT = 30;
    const SLOT_COUNT = 12;

    /* Duplicate blocking only among the last 6 ACCEPTED words. */
    const DUPLICATE_WINDOW = 6;
    const FINAL_HISTORY_LIMIT = 1000;
    const FIRST_INTERIM_TRANSLATE_DELAY = 40;
    const INTERIM_TRANSLATE_DELAY = 300;

    const STORAGE_KEY = 'speechTranslationFullStateV10';

    /* Is this device a mobile device? */

      ['Finnish', 'fi-FI'], ['French — Canada', 'fr-CA'], ['French — France', 'fr-FR'], ['Galician', 'gl-ES'],
      ['German', 'de-DE'], ['Greek', 'el-GR'], ['Gujarati', 'gu-IN'], ['Hebrew', 'he-IL'], ['Hindi', 'hi-IN'],
      ['Hungarian', 'hu-HU'], ['Icelandic', 'is-IS'], ['Indonesian', 'id-ID'], ['Italian', 'it-IT'], ['Japanese', 'ja-JP'],
      ['Kannada', 'kn-IN'], ['Korean', 'ko-KR'], ['Latvian', 'lv-LV'], ['Lithuanian', 'lt-LT'], ['Malay — Malaysia', 'ms-MY'],

      ['Samoan', 'sm'], ['Scots Gaelic', 'gd'], ['Serbian', 'sr'], ['Sesotho', 'st'], ['Shona', 'sn'], ['Sindhi', 'sd'],
      ['Sinhala', 'si'], ['Slovak', 'sk'], ['Slovenian', 'sl'], ['Somali', 'so'], ['Spanish', 'es'], ['Sundanese', 'su'],
      ['Swahili', 'sw'], ['Swedish', 'sv'], ['Tagalog', 'tl'], ['Tajik', 'tg'], ['Tamil', 'ta'], ['Tatar', 'tt'],
      ['Telugu', 'te'], ['Thai', 'th'], ['Turkish', 'tr'], ['Turkmen', 'tk'], ['Ukrainian', 'uk'], ['Urdu', 'ur'],
      ['Uyghur', 'ug'], ['Uzbek', 'uz'], ['Vietnamese', 'vi'], ['Welsh', 'cy'], ['Xhosa', 'xh'], ['Yiddish', 'yi'],
      ['Yoruba', 'yo'], ['Zulu', 'zu']
    ];

    const SPEECH_DEFAULTS = {
      af: 'af-ZA', ar: 'ar-SA', bg: 'bg-BG', bn: 'bn-IN', ca: 'ca-ES', cs: 'cs-CZ', da: 'da-DK', de: 'de-DE',
      el: 'el-GR', en: 'en-US', es: 'es-ES', eu: 'eu-ES', fa: 'fa-IR', fi: 'fi-FI', fr: 'fr-FR', gl: 'gl-ES',
      gu: 'gu-IN', he: 'he-IL', hi: 'hi-IN', hr: 'hr-HR', hu: 'hu-HU', id: 'id-ID', is: 'is-IS', it: 'it-IT',
      ja: 'ja-JP', kn: 'kn-IN', ko: 'ko-KR', lt: 'lt-LT', lv: 'lv-LV', ml: 'ml-IN', mr: 'mr-IN', ms: 'ms-MY',
      nl: 'nl-NL', no: 'nb-NO', pl: 'pl-PL', pt: 'pt-BR', ro: 'ro-RO', ru: 'ru-RU', sk: 'sk-SK', sl: 'sl-SI',
      sr: 'sr-RS', sv: 'sv-SE', ta: 'ta-IN', te: 'te-IN', th: 'th-TH', tr: 'tr-TR', uk: 'uk-UA', ur: 'ur-PK', vi: 'vi-VN'
    };

    function speechToTranslationCode(speechCode) {
      const code = String(speechCode || '');
      if (code === 'cmn-Hans-CN') return 'zh-CN';
      if (code === 'cmn-Hant-TW' || code === 'yue-Hant-HK') return 'zh-TW';
      const base = code.split('-')[0].toLowerCase();
      const exists = TRANSLATION_LANGUAGES.some(item => item[1] === base);
      return exists ? base : null;
    }

    function translationToSpeechCode(translationCode) {
      const code = String(translationCode || '');
      if (code === 'zh-CN') return 'cmn-Hans-CN';
      if (code === 'zh-TW') return 'cmn-Hant-TW';
      if (SPEECH_DEFAULTS[code]) return SPEECH_DEFAULTS[code];
      const found = SPEECH_LANGUAGES.find(item => item[1].toLowerCase().startsWith(code.toLowerCase() + '-'));
      return found ? found[1] : null;
    }

    /* =========================================================
       CURRENT LANG
    ========================================================= */

    let speechLanguage = 'sr-RS';
    let translationLanguage = 'ru';

    /* =========================================================
       DOM
    ========================================================= */

    const newLineElement = document.getElementById('new');
    const savedLinesElement = document.getElementById('savedLines');
    const finalTextElement = document.getElementById('finalText');
    const stableWordsElement = document.getElementById('stableWords');
    const cursorInfo = document.getElementById('cursorInfo');
    const sortButton = document.getElementById('sortButton');
    const errorElement = document.getElementById('error');
    const recordButton = document.getElementById('recordButton');
    const recordStatus = document.getElementById('recordStatus');
    const languageButton = document.getElementById('languageButton');
    const languageModal = document.getElementById('languageModal');
    const closeLanguageModal = document.getElementById('closeLanguageModal');
    const speechLanguageSelect = document.getElementById('speechLanguageSelect');
    const translationLanguageSelect = document.getElementById('translationLanguageSelect');
    const swapLanguagesButton = document.getElementById('swapLanguages');
    const applyLanguages = document.getElementById('applyLanguages');
    const deleteHistoryButton = document.getElementById('deleteHistoryButton');

    /* =========================================================
       ERROR UI
    ========================================================= */

    function showError(message) {
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function hideError() {
      errorElement.style.display = 'none';
      errorElement.textContent = '';
    }

    /* =========================================================
       STATUS
    ========================================================= */

    function setRecordStatus(state, text) {
      recordButton.classList.remove('recording', 'starting', 'stopped', 'ready', 'error');
      recordButton.classList.add(state);
      recordStatus.textContent = text;
    }

    /* =========================================================
       APP DATA
    ========================================================= */

    let liveHistory = [];
    let savedWords = [];
    let finalHistory = [];
    let slotCursor = 0;
    let recentAcceptedKeys = [];
    const slots = [];

    let currentInterim = {
      original: '', translation: '', translatedOriginal: '',
      generation: 0, requestSequence: 0, appliedSequence: 0
    };
    let interimTranslationTimer = null;

    /* =========================================================
       STORAGE
    ========================================================= */

    function saveAllState() {
      try {
        const state = {
          speechLanguage, translationLanguage,
          liveHistory: liveHistory.slice(0, LIVE_LINE_LIMIT),
          savedWords, finalHistory, slotCursor,
          recentAcceptedKeys: recentAcceptedKeys.slice(-DUPLICATE_WINDOW),
          slots: slots.map(slot => ({
            word: slot.word || '',
            key: slot.key || '',
            translation: slot.translation.textContent || ''
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn('Storage save:', error);
      }
    }

    function loadAllState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (error) {
        console.warn('Storage load:', error);
      }
      return null;
    }

    /* =========================================================
       TRANSLATION
    ========================================================= */

    const translationCache = new Map();
    const pendingTranslations = new Map();

    function translateText(text, targetLang) {
      const cleanText = String(text || '').trim();
      if (!cleanText) return Promise.resolve('');
      const cacheKey = targetLang + ':' + cleanText.toLocaleLowerCase();
      if (translationCache.has(cacheKey)) return Promise.resolve(translationCache.get(cacheKey));
      if (pendingTranslations.has(cacheKey)) return pendingTranslations.get(cacheKey);

      const request = fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(cleanText)}`)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
          const translated = Array.isArray(data?.[0]) ? data[0].map(part => part?.[0] || '').join('') : '';
          translationCache.set(cacheKey, translated);
          return translated;
        })
        .catch(error => {
          console.error('Translation:', error);
          return '';
        })
        .finally(() => pendingTranslations.delete(cacheKey));

      pendingTranslations.set(cacheKey, request);
      return request;
    }

    /* =========================================================
       CLEAN
    ========================================================= */

    function cleanWordValue(word) {
      return String(word || '').trim().replace(/^[.,!?;:"'()[\]{}]+|[.,!?;:"'()[\]{}]+$/g, '');
    }

    function normalizeWord(word) {
      return cleanWordValue(word).toLocaleLowerCase();
    }

    /* =========================================================
       LANGUAGE UI
    ========================================================= */

    function fillLanguageSelects() {
      const speechFragment = document.createDocumentFragment();
      for (const [name, code] of SPEECH_LANGUAGES) {
        const option = document.createElement('option');
        option.value = code; option.textContent = `${name} — ${code}`;
        speechFragment.appendChild(option);
      }
      speechLanguageSelect.replaceChildren(speechFragment);

      const translationFragment = document.createDocumentFragment();
      for (const [name, code] of TRANSLATION_LANGUAGES) {
        const option = document.createElement('option');
        option.value = code; option.textContent = `${name} — ${code}`;
        translationFragment.appendChild(option);
      }
      translationLanguageSelect.replaceChildren(translationFragment);
    }

    function shortLanguageCode(code) {
      return String(code || '').split('-')[0].toUpperCase();
    }

    function updateLanguageButton() {
      languageButton.textContent = `${shortLanguageCode(speechLanguage)} → ${shortLanguageCode(translationLanguage)}`;
    }

    function openLanguageSelector() {
      speechLanguageSelect.value = speechLanguage;
      translationLanguageSelect.value = translationLanguage;
      languageModal.classList.add('open');
    }

    function closeLanguageSelector() {
      languageModal.classList.remove('open');
    }

    languageButton.addEventListener('click', openLanguageSelector);
    closeLanguageModal.addEventListener('click', closeLanguageSelector);
    languageModal.addEventListener('click', event => {
      if (event.target === languageModal) closeLanguageSelector();
    });

    swapLanguagesButton.addEventListener('click', () => {
      const oldSpeech = speechLanguageSelect.value;
      const oldTarget = translationLanguageSelect.value;
      const newSpeech = translationToSpeechCode(oldTarget);
      const newTarget = speechToTranslationCode(oldSpeech);

      if (newSpeech && newTarget) {
        speechLanguageSelect.value = newSpeech;
        translationLanguageSelect.value = newTarget;
      }
    });

    /* =========================================================
       SAVED
    ========================================================= */

    function renderSavedWords() {
      const fragment = document.createDocumentFragment();
      for (const word of savedWords) {
        const item = document.createElement('span');
        item.textContent = word;
        fragment.appendChild(item);
      }
      savedLinesElement.replaceChildren(fragment);
    }

    function saveWord(word) {
      const clean = cleanWordValue(word);
      if (!clean) return;
      savedWords.push(clean);
      const element = document.createElement('span');
      element.textContent = clean;
      savedLinesElement.appendChild(element);
      saveAllState();
    }

    /* =========================================================
       12 SLOTS
    ========================================================= */

    function createStableSlots() {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < SLOT_COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'stable-word';
        const number = document.createElement('span'); number.className = 'slot-number'; number.textContent = i + 1;
        const original = document.createElement('span'); original.className = 'stable-original'; original.textContent = '—';
        const translation = document.createElement('span'); translation.className = 'stable-translation';
        card.append(number, original, translation);

        const slot = { card, original, translation, word: '', key: '', version: 0 };
        card.addEventListener('click', () => { if (slot.word) saveWord(slot.word); });
        slots.push(slot);
        fragment.appendChild(card);
      }
      stableWordsElement.appendChild(fragment);
      updateCursorUI();
    }

    function updateCursorUI() {
      for (let i = 0; i < SLOT_COUNT; i++) {
        slots[i].card.classList.toggle('cursor', i === slotCursor);
      }
      cursorInfo.textContent = `next: ${slotCursor + 1}`;
    }

    function duplicateRecently(key) { return recentAcceptedKeys.includes(key); }
    function rememberAcceptedKey(key) {
      recentAcceptedKeys.push(key);
      if (recentAcceptedKeys.length > DUPLICATE_WINDOW) recentAcceptedKeys.splice(0, recentAcceptedKeys.length - DUPLICATE_WINDOW);
    }

    function writeWordToNextSlot(word) {
      const clean = cleanWordValue(word);
      if (!clean) return;
      const key = normalizeWord(clean);
      if (duplicateRecently(key)) return;

      const slot = slots[slotCursor];
      slot.version++;
      const version = slot.version;
      slot.word = clean; slot.key = key;
      slot.original.textContent = clean;
      slot.translation.textContent = '...';

      rememberAcceptedKey(key);
      const targetSlot = slot;
      slotCursor = (slotCursor + 1) % SLOT_COUNT;
      updateCursorUI();
      saveAllState();

      translateText(clean, translationLanguage).then(translated => {
        if (targetSlot.version !== version) return;
        targetSlot.translation.textContent = translated;
        saveAllState();
      });
    }

    function clearSlots() {
      slotCursor = 0;
      recentAcceptedKeys = [];
      for (const slot of slots) {
        slot.version++;
        slot.word = ''; slot.key = '';
        slot.original.textContent = '—';
        slot.translation.textContent = '';
      }
      updateCursorUI();
    }

    /* =========================================================
       LIVE
    ========================================================= */

    let previousLiveText = '';

    function createLiveLineElement(item) {
      const line = document.createElement('div');
      if (!item || !Array.isArray(item.words)) return line;

      for (const entry of item.words) {
        if (!entry || !entry.word) continue;
        const wordElement = document.createElement('span');
        wordElement.textContent = entry.word + ' ';
        wordElement.addEventListener('click', () => saveWord(entry.word));
        if (entry.translation) {
          const translationElement = document.createElement('span');
          translationElement.textContent = `(${entry.translation}) `;
          wordElement.appendChild(translationElement);
        }
        line.appendChild(wordElement);
      }
      return line;
    }

    function renderLiveHistory() {
      const fragment = document.createDocumentFragment();
      for (const item of liveHistory) fragment.appendChild(createLiveLineElement(item));
      newLineElement.replaceChildren(fragment);
    }

    function addRawLiveLine(words) {
      const cleaned = words.map(cleanWordValue).filter(Boolean);
      if (!cleaned.length) return;
      const liveKey = cleaned.join(' ').toLocaleLowerCase();
      if (liveKey === previousLiveText) return;
      previousLiveText = liveKey;

      const item = { words: cleaned.map(word => ({ word, translation: '' })) };
      liveHistory.unshift(item);
      if (liveHistory.length > LIVE_LINE_LIMIT) liveHistory.length = LIVE_LINE_LIMIT;

      const line = document.createElement('div');
      for (const entry of item.words) {
        const wordElement = document.createElement('span');
        wordElement.textContent = entry.word + ' ';
        wordElement.addEventListener('click', () => saveWord(entry.word));
        line.appendChild(wordElement);

        writeWordToNextSlot(entry.word);

        translateText(entry.word, translationLanguage).then(translated => {
          entry.translation = translated;
          if (translated) {
            const translationElement = document.createElement('span');
            translationElement.textContent = `(${translated}) `;
            wordElement.appendChild(translationElement);
          }
          saveAllState();
        });
      }
      newLineElement.prepend(line);
      while (newLineElement.children.length > LIVE_LINE_LIMIT) newLineElement.lastElementChild.remove();
      saveAllState();
    }

    /* =========================================================
       FINAL
    ========================================================= */

    function countWords(text) { return String(text || '').trim().split(/\s+/).filter(Boolean).length; }

    function trimFinalHistory() {
      let total = finalHistory.reduce((sum, item) => sum + countWords(item.original), 0);
      while (total > FINAL_HISTORY_LIMIT && finalHistory.length > 1) {
        const removed = finalHistory.shift();
        total -= countWords(removed?.original);
      }
    }

    function createFinalElement(item, interim = false) {
      const wrapper = document.createElement('div');
      wrapper.className = interim ? 'final-entry interim' : 'final-entry';
      const label = document.createElement('div'); label.className = 'final-label'; label.textContent = interim ? 'Live interim' : 'Final';
      const original = document.createElement('div'); original.className = 'final-original'; original.textContent = item.original || '';
      const translation = document.createElement('div'); translation.className = 'final-translation';

      if (item.translation) {
        translation.textContent = item.translation;
        if (interim && item.translatedOriginal && item.translatedOriginal !== item.original) {
          translation.classList.add('lagging');
          const mark = document.createElement('span'); mark.className = 'translation-status'; mark.textContent = '↻';
          translation.appendChild(mark);
        }
      } else {
        translation.textContent = '…';
      }
      wrapper.append(label, original, translation);
      return wrapper;
    }

    function renderFinalHistory() {
      const fragment = document.createDocumentFragment();
      if (currentInterim.original) fragment.appendChild(createFinalElement(currentInterim, true));
      for (let i = finalHistory.length - 1; i >= 0; i--) fragment.appendChild(createFinalElement(finalHistory[i], false));
      finalTextElement.replaceChildren(fragment);
    }

    /* =========================================================
       INTERIM TRANSLATION
    ========================================================= */

    function clearCurrentInterim() {
      currentInterim.generation++;
      currentInterim.original = ''; currentInterim.translation = ''; currentInterim.translatedOriginal = '';
      currentInterim.requestSequence = 0; currentInterim.appliedSequence = 0;
      if (interimTranslationTimer) { clearTimeout(interimTranslationTimer); interimTranslationTimer = null; }
    }

    function scheduleInterimTranslation(delay) {
      if (interimTranslationTimer) clearTimeout(interimTranslationTimer);
      interimTranslationTimer = setTimeout(() => {
        interimTranslationTimer = null;
        requestInterimTranslation();
      }, delay);
    }

    function requestInterimTranslation() {
      const text = currentInterim.original;
      if (!text || currentInterim.translatedOriginal === text) return;
      const generation = currentInterim.generation;
      const sequence = ++currentInterim.requestSequence;
      const target = translationLanguage;

      translateText(text, target).then(translated => {
        if (generation !== currentInterim.generation || !translated || sequence < currentInterim.appliedSequence) return;
        currentInterim.appliedSequence = sequence;
        currentInterim.translation = translated;
        currentInterim.translatedOriginal = text;
        renderFinalHistory();

        if (currentInterim.original !== text) scheduleInterimTranslation(INTERIM_TRANSLATE_DELAY);
      });
    }

    function updateLongInterim(transcript) {
      const text = String(transcript || '').trim();
      if (!text || text === currentInterim.original) return;
      const alreadyHasTranslation = Boolean(currentInterim.translation);
      currentInterim.original = text;
      renderFinalHistory();
      scheduleInterimTranslation(alreadyHasTranslation ? INTERIM_TRANSLATE_DELAY : FIRST_INTERIM_TRANSLATE_DELAY);
    }

    function appendFinalHistory(transcript) {
      const text = String(transcript || '').trim();
      if (!text) return;
      clearCurrentInterim();

      const item = { original: text, translation: '', targetLanguage: translationLanguage };
      finalHistory.push(item);
      trimFinalHistory();
      renderFinalHistory();
      saveAllState();

      translateText(text, translationLanguage).then(translated => {
        if (!finalHistory.includes(item)) return;
        item.translation = translated;
        item.targetLanguage = translationLanguage;
        renderFinalHistory();
        saveAllState();
      });
    }

    /* =========================================================
       CREATE SLOTS
    ========================================================= */
    createStableSlots();

    /* =========================================================
       RESTORE STATE
    ========================================================= */
    const restoredState = loadAllState();
    if (restoredState) {
      if (typeof restoredState.speechLanguage === 'string') speechLanguage = restoredState.speechLanguage;
      if (typeof restoredState.translationLanguage === 'string') translationLanguage = restoredState.translationLanguage;
      if (Array.isArray(restoredState.liveHistory)) liveHistory = restoredState.liveHistory.slice(0, LIVE_LINE_LIMIT);
      if (Array.isArray(restoredState.savedWords)) savedWords = restoredState.savedWords.filter(item => typeof item === 'string');
      if (Array.isArray(restoredState.finalHistory)) {
        finalHistory = restoredState.finalHistory.map(item => ({
          original: item.original, translation: item.translation || '', targetLanguage: item.targetLanguage || translationLanguage
        }));
        trimFinalHistory();
      }
      if (Number.isInteger(restoredState.slotCursor)) slotCursor = Math.max(0, restoredState.slotCursor % SLOT_COUNT);
      if (Array.isArray(restoredState.slots)) {
        for (let i = 0; i < SLOT_COUNT; i++) {
          const stored = restoredState.slots[i];
          const slot = slots[i];
          if (!stored) continue;
          slot.word = stored.word || '';
          slot.key = slot.word ? normalizeWord(slot.word) : '';
          slot.original.textContent = slot.word || '—';
          slot.translation.textContent = stored.translation || '';
        }
      }
      if (Array.isArray(restoredState.recentAcceptedKeys)) recentAcceptedKeys = restoredState.recentAcceptedKeys.slice(-DUPLICATE_WINDOW);
    }

    fillLanguageSelects();
    updateLanguageButton();
    renderLiveHistory();
    renderSavedWords();
    renderFinalHistory();
    updateCursorUI();

    /* =========================================================
       SPEECH RECOGNITION (MOBILE-OPTIMIZED FIXES APPLIED)
    ========================================================= */

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let shouldRecognize = false;
    let recognitionGeneration = 0; // Guard against stale onend events
    let restartTimer = null;

    function createRecognition() {
      if (!SpeechRecognition) return false;
      
      recognition = new SpeechRecognition();
      
      // Adaptive continuous. Mobile = false (short sessions), Desktop = true.
      recognition.continuous = !isMobile;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      // Event: Transparent states
      recognition.onaudiostart = () => console.log('SpeechRecog: onaudiostart');
      recognition.onsoundstart = () => console.log('SpeechRecog: onsoundstart');
      recognition.onspeechstart = () => console.log('SpeechRecog: onspeechstart');

      recognition.onstart = () => {
        hideError();
        setRecordStatus('recording', 'Recording');
      };

      recognition.onresult = (event) => {
        let longestInterim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (!result || !result[0]) continue;
          
          const transcript = String(result[0].transcript || '').trim();
          if (!transcript) continue;

          if (result.isFinal) {
            appendFinalHistory(transcript);
          } else {
            if (transcript.length > longestInterim.length) longestInterim = transcript;
            const words = transcript.split(/\s+/).filter(Boolean);
            addRawLiveLine(words.slice(-LIVE_WORD_LIMIT));
          }
        }
        if (longestInterim) updateLongInterim(longestInterim);
      };

      recognition.onerror = (event) => {
        console.warn('Speech error:', event.error);
        const err = event.error;

        // Fatal errors -> stop completely
        if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture') {
          shouldRecognize = false;
          setRecordStatus('error', err === 'audio-capture' ? 'No mic' : 'Blocked');
          showError('Microphone permission blocked or hardware unavailable.');
        }
        // NOTE: For 'no-speech', 'network', 'aborted', we do NOT restart here anymore.
        // We let `onend` reliably handle the restart loop.
      };

      recognition.onend = () => handleRecognitionEnd(recognitionGeneration);

      return true;
    }

    function handleRecognitionEnd(generation) {
      console.log('SpeechRecog: onend');
      
      // If user stopped, or generation changed (language swap / double clicks), ignore
      if (!shouldRecognize || generation !== recognitionGeneration) {
        if (!shouldRecognize) setRecordStatus('stopped', 'Stopped');
        return;
      }

      // The reliable restart loop
      setRecordStatus('starting', 'Restarting...');
      if (restartTimer) clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (shouldRecognize && generation === recognitionGeneration) {
          startRecognitionInternal();
        }
      }, 250); // Small delay to let browser breathe
    }

    function startRecognitionInternal() {
      if (!shouldRecognize) return;
      if (!recognition) {
        if (!createRecognition()) {
          showError('Speech Recognition is not supported by this browser.');
          setRecordStatus('error', 'Unsupported');
          return;
        }
      }

      recognition.lang = speechLanguage;
      recognitionGeneration++; // New session generation
      
      try {
        setRecordStatus('starting', 'Starting');
        recognition.start();
      } catch (error) {
        console.warn('recognition.start() error:', error);
        // If it's already started or crashed, abort it to force a clean onend
        try { recognition.abort(); } catch(e){}
      }
    }

    // MAIN START/STOP BUTTON (Start directly on click without getUserMedia)
    recordButton.addEventListener('click', () => {
      if (!SpeechRecognition) {
        setRecordStatus('error', 'Unsupported');
        showError('This browser does not provide SpeechRecognition.');
        return;
      }

      if (!window.isSecureContext) {
        setRecordStatus('error', 'HTTPS needed');
        showError('HTTPS is required for microphone access on mobile.');
        return;
      }

      if (shouldRecognize) {
        // TURN OFF
        shouldRecognize = false;
        recognitionGeneration++; // invalidate any pending onend restarts
        if (restartTimer) clearTimeout(restartTimer);
        
        setRecordStatus('stopped', 'Stopped');
        
        if (recognition) {
          try {
            recognition.abort(); // abort instead of stop
          } catch (e) {}
        }
      } else {
        // TURN ON (Directly starts inside user gesture)
        shouldRecognize = true;
        hideError();
        startRecognitionInternal();
      }
    });

    /* =========================================================
       LANGUAGE APPLY
    ========================================================= */

    applyLanguages.addEventListener('click', () => {
      const speechChanged = speechLanguageSelect.value !== speechLanguage;
      speechLanguage = speechLanguageSelect.value;
      translationLanguage = translationLanguageSelect.value;
      
      if (currentInterim.original) scheduleInterimTranslation(FIRST_INTERIM_TRANSLATE_DELAY);
      
      updateLanguageButton();
      renderFinalHistory();
      saveAllState();
      closeLanguageSelector();

      // If speech language changed while running, restart immediately
      if (speechChanged && shouldRecognize) {
        recognitionGeneration++; // Invalidate old loops
        if (restartTimer) clearTimeout(restartTimer);
        
        if (recognition) {
           try { recognition.abort(); } catch(e) {}
        }
        
        // Give it a tiny moment to clean up before starting with new lang
        setTimeout(() => {
          if (shouldRecognize) startRecognitionInternal();
        }, 100);
      }
    });

    /* =========================================================
       DELETE
    ========================================================= */

    deleteHistoryButton.addEventListener('click', () => {
      if (!window.confirm('Delete Live, Last 12 words, Saved and Final history?')) return;
      liveHistory = []; savedWords = []; finalHistory = []; previousLiveText = '';
      clearCurrentInterim(); clearSlots();
      newLineElement.replaceChildren(); savedLinesElement.replaceChildren(); finalTextElement.replaceChildren();
      try {
        [STORAGE_KEY, 'speechTranslationFullStateV10', 'speechTranslationFullStateV9'].forEach(k => localStorage.removeItem(k));
      } catch (e) {}
      saveAllState();
      closeLanguageSelector();
    });

    /* =========================================================
       SORT
    ========================================================= */

    sortButton.addEventListener('click', () => {
      savedWords.sort((a, b) => a.localeCompare(b));
      renderSavedWords();
      saveAllState();
    });

    /* =========================================================
       MOBILE MENU
    ========================================================= */

    const menuButtons = document.querySelectorAll('.menu-button');
    const columns = document.querySelectorAll('.column');

    menuButtons.forEach(button => {
      button.addEventListener('click', () => {
        const target = button.dataset.target;
        columns.forEach(column => column.classList.remove('active'));
        menuButtons.forEach(item => item.classList.remove('active'));
        document.getElementById(target).classList.add('active');
        button.classList.add('active');
      });
    });

    /* =========================================================
       PAGE LIFECYCLE
    ========================================================= */

    window.addEventListener('pagehide', () => saveAllState());
    window.addEventListener('beforeunload', () => {
      saveAllState();
      shouldRecognize = false;
      if (restartTimer) clearTimeout(restartTimer);
      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }
    });

    /* =========================================================
       INITIAL STATUS
    ========================================================= */

    if (!SpeechRecognition) {
      setRecordStatus('error', 'Unsupported');
      showError('This browser does not provide SpeechRecognition.');
    } else if (!window.isSecureContext) {
      setRecordStatus('error', 'HTTPS needed');
      showError('On mobile Chrome microphone access requires a secure HTTPS page. Open this app through https://.');
    } else {
      setRecordStatus('ready', 'Start');
    }

  </script>
</body>
</html>
